name = "lean_sage_port"
defaultTargets = ["Probes", "runtime-quotient"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "hex"
git = "https://github.com/leanprover/hex.git"
rev = "v0.10.0"

# Mathlib comes last: Lake gives the last requirement precedence for shared dependencies, and the
# Mathlib build cache is valid only for Mathlib's own versions of them. The revision is the
# `mathlib` revision of the Hex release above; AGENTS.md states the rule.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "6b7abb3c7686292736be2955bd3eb9ebf63b456a"

[[lean_lib]]
name = "Probes"

[[lean_exe]]
name = "runtime-quotient"
root = "Probes.Main"
