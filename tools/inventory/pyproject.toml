[project]
name = "sage-inventory"
version = "0.1.0"
description = "Index the local SageMath checkout and measure how much of it the capability inventory accounts for."
requires-python = ">=3.12"
dependencies = [
  "cyclopts>=3",
  "pydantic>=2.9",
  "pyyaml>=6",
  "cython>=3.1",
]

[project.scripts]
sage-inventory = "sage_inventory.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage_inventory"]
