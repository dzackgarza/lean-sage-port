# Reuse survey of the lean-categories catalogue (lean-categories, lean-cas-dsl, lean-cas-dsl-leaf-contracts).
# Snapshot: surveyed 2026-11-17 at the revisions below (main HEADs, fresh shallow clones).
# One component per export record of lean-cas-dsl-leaf-contracts/api/declared-ports.json: categories, objects,
# functors, operations with entries, and derived operations (ids with no entry: action:..., #map, #component and
# similar), and the classifier entries (clf.*), each listed separately. id, declarations, paths, kind and evidence are generated from the export and a
# declaration index of the clones; capability, domain, executable, correctness and notes were written from the Lean
# declarations and docs (derived operations: templated from their parent). Nothing was built or evaluated.

