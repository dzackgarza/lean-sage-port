# Executability audit of CAS-relevant mathematics in Lean core, Std, Batteries and Mathlib.
#
# Version basis. The records describe Lean v4.36.0 (commit 611c117bfaf7b7ae1cfcf246ce6fba31e8f509e9)
# and Mathlib master 6d97e8ad9c32c778e7000ffda543a29488155467 with the Batteries and Plausible revisions
# that Mathlib master resolves (see the [[source]] records). Every declaration name and path was
# checked against those trees: names through the .ilean declaration indexes of the prebuilt master
# packages and the v4.36.0 toolchain, and by text search of the source for structure fields, class
# fields and syntax declarations, which the .ilean indexes do not list.
#
# Two kinds of evidence. (1) Master: read from source, not run. Computability on master was
# classified from the source text: `noncomputable` modifiers and sections, `@[extern]`,
# `@[implemented_by]`, `@[csimp]`, and Decidable instances. Nothing was compiled or evaluated on the
# master trees. (2) v4.33.0: run. The `#eval`, `decide` and `norm_num` results and the times in
# `performance` were measured earlier on Lean v4.33.0 with Mathlib db584cd6d46c92f209a44c0f1c829460d327499d
# (Batteries 4488d40d070b9700d4d5a6aa342f0d40c31b2a2d, Plausible b7eb3304aeae834b12dda98993a37f6a41f6f0bb).
# That run used the Lean binary directly with LEAN_PATH set to the prebuilt package build directories.
# A scratch `#audit` command reported `Lean.isNoncomputable` and whether compiled IR exists
# (`Lean.IR.findEnvDecl`). `#eval` ran Mathlib code in the IR interpreter; core `Nat`/`Int`
# arithmetic called native GMP code. Profiler times: "<50 ms" means below the 50 ms profiler
# threshold. In that package directory only 78 of 191 Batteries modules were built, so Batteries
# data structures and the Mathlib modules that import them were read from source only.
# Each evidence field ends with a "Master check" sentence that says whether the declaration text
# that the run depended on is unchanged on master. The run results were not repeated on master.
# File:line citations in evidence and notes point into the master trees.
#
# executable: "ran" = run on v4.33.0 and source unchanged in the respects that decide computability on
# master; "defined-computable" = computable definitions on master, not run; "noncomputable" = the
# master source marks the operation noncomputable; "not-present" = no implementation in these trees.

