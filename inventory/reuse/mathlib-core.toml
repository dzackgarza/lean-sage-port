kind = "decision-procedure"
executable = "ran"
performance = "measured: `decide` on Nat.gcd (2^200-1) (2^120-1) = 2^40-1 and on a 23x20-digit product, each <50 ms"
status = "reusable"
evidence = "`example : Nat.gcd (2^200 - 1) (2^120 - 1) = 2^40 - 1 := by decide` checked; a deliberately false product claim was refuted by `decide`. Master check (Lean v4.36.0, Mathlib 6d97e8ad9c): read from source, not run. Unchanged since v4.33.0: Nat.gcd, Nat.mul, Nat.pow. Text changed since v4.33.0, noncomputable modifier and section status unchanged: Nat.mod. The kernel GMP acceleration was observed on v4.33.0 only: the v4.36.0 toolchain ships no kernel C++ source (src/lean/kernel is empty), so it was not read on v4.36.0. The run results above are from v4.33.0 and were not repeated on master."
notes = "Certificate checking with large integers is cheap in the kernel. Structural recursion over large Nat (e.g. trial division) is not: it hits kernel deep-recursion limits."

