[[component]]
id = "lean-core.int.bignum-arithmetic"
source = "lean-core"
capability = "Arbitrary-precision integer and natural-number arithmetic (add, mul, div, mod, pow, shifts, bitwise)"
domain = "Nat, Int"
declarations = ["Nat.add", "Nat.sub", "Nat.mul", "Nat.div", "Nat.mod", "Nat.pow", "Nat.gcd", "Nat.log2", "Nat.land", "Nat.lor", "Nat.xor", "Nat.shiftLeft", "Nat.shiftRight", "Nat.testBit", "Int.add", "Int.sub", "Int.neg", "Int.mul", "Int.ediv", "Int.emod", "Int.tdiv", "Int.tmod", "Int.decEq"]
paths = ["src/Init/Prelude.lean", "src/Init/Data/Nat/Basic.lean", "src/Init/Data/Nat/Gcd.lean", "src/Init/Data/Nat/Log2.lean", "src/Init/Data/Nat/Bitwise/Basic.lean", "src/Init/Data/Int/Basic.lean", "src/Init/Data/Int/DivMod/Basic.lean"]
kind = "data-structure"
executable = "ran"
performance = "measured: 60x60-digit product <50 ms; 3^2000000 (about 950000 digits) then Nat.log2 77 ms; 2^(2^22) mod p <50 ms; 10000! with decimal conversion 362 ms"
status = "reusable"
evidence = "#eval a60*b60 printed the 120-digit product; #eval Nat.log2 (3^2000000) = 3169925; #eval (2^(2^22)) % 1000000007 = 125918023. Master check (Lean v4.36.0, Mathlib 6d97e8ad9c): read from source, not run. Unchanged since v4.33.0: Nat.add, Nat.sub, Nat.mul, Nat.div, Nat.pow, Nat.gcd, Nat.log2, Nat.land, Nat.lor, Nat.xor, Nat.shiftLeft, Nat.shiftRight, Nat.testBit, Int.add, Int.sub, Int.neg, Int.mul, Int.ediv, Int.emod, Int.tdiv, Int.tmod, Int.decEq. Text changed since v4.33.0, noncomputable modifier and section status unchanged: Nat.mod. v4.36.0 source has @[extern] runtime implementations lean_nat_add, sub, mul, div, mod, pow, gcd, log2, land, lor, lxor, shiftl, shiftr, dec_eq, dec_lt, dec_le and lean_int_add, sub, neg, mul, ediv, emod, div (tdiv), mod (tmod), dec_eq, dec_lt, dec_le. The run results above are from v4.33.0 and were not repeated on master."
notes = "GMP-backed runtime (extern implementations). The kernel also has GMP acceleration for Nat literals, so `decide` on large Nat equalities is cheap."

