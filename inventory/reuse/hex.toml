# Reuse survey of the Hex Lean 4 libraries for lean-sage-port.
# Snapshot: surveyed 2026-11-17 at the revisions below. Components were read from hex-dev source
# (source = "hex-dev"); each component's notes say "released: hex v0.10.0" or "unreleased".
# Both revisions are the main HEADs at survey time. Nothing was built or evaluated on any
# toolchain, so executable is at most "defined-computable" (defined without noncomputable).

[[source]]
name = "hex"
url = "https://github.com/leanprover/hex"
revision = "f4b180cfe51692a4e41587d731c92c08a9a63bc4"
license = "Apache-2.0"
lean_toolchain = "leanprover/lean4:v4.35.0-rc3"
mathlib_rev = "6b7abb3c7686292736be2955bd3eb9ebf63b456a"
surveyed = "2026-11-17"
notes = "Revision read: main HEAD f4b180cfe51692a4e41587d731c92c08a9a63bc4 = release tag v0.10.0 (newest tag; git ls-remote 2026-11-17T02:18Z shows HEAD and refs/tags/v0.10.0 at this commit; no GitHub release objects). Toolchain named: leanprover/lean4:v4.35.0-rc3; Mathlib rev named: 6b7abb3c. Project basis is Lean v4.36.0 + Mathlib master + Hex main; whether Hex builds on that basis was not tested here (no Hex code was built or run on any toolchain). Aggregator only: no Lean source of its own. Hex.lean is an umbrella of 59 public imports. lakefile.toml requires every split repo leanprover/hex-* at rev v0.10.0, mathlib at 6b7abb3c (a master commit of 2026-09-28, not a tag), batteries at rev main (manifest lock 33131f4fb10067cb3009bf4db615d9680c1ccd6b), and HexPermGroup with option hexPermGroupNative=false. Inherited deps: TauCeti 1c497c34, AINTLIB ab145148, plausible, LeanSearchClient, importGraph, proofwidgets, aesop, Qq, Cli. Commit message: sync from hex-dev@2d745f569372 (2026-10-15). AGENTS.md still names stale *-mathlib repos; README uses *-theory names. Split repos were not cloned; their content is taken to equal hex-dev at 2d745f5."

[[source]]
name = "hex-dev"
url = "https://github.com/kim-em/hex-dev"
revision = "3a1b9813b1d1876ae0c89f5cfc20da05547bd854"
license = "Apache-2.0"
lean_toolchain = "leanprover/lean4:v4.35.0-rc3"
mathlib_rev = "6b7abb3c7686292736be2955bd3eb9ebf63b456a"
surveyed = "2026-11-17"
notes = "Revision read: main HEAD 3a1b9813b1d1876ae0c89f5cfc20da05547bd854 (commit 2026-11-14; git ls-remote 2026-11-17T02:18Z confirms HEAD is still this commit). No release tag: hex-dev tags are only work tags (attempt*, audit/*, bench/*, measurements/*, issue-*, spec-v1, spec-v2); releases are published as leanprover/hex v0.10.0, synced from hex-dev@2d745f569372. Toolchain named: leanprover/lean4:v4.35.0-rc3; Mathlib rev named: 6b7abb3c. Components are classified as they exist at this commit. No Hex code was built or run on any toolchain. Development monorepo, about 120 libraries, 6093 .lean files. Each computational HexX imports only Init/Std/Lean (Batteries in HexMvFactor, HexNumberField, HexSmith); each HexXTheory imports Mathlib and holds the bridges and correctness theorems. lakefile.lean also requires verso v4.35.0-rc3, NautyFFI ec859701 (test-only), lean-bench (master), TauCeti 1c497c34; batteries locked 33131f4f. libraries.yml is the DAG and phase state (deps, mathlib flag, done_through 0..7, status); scripts/check_dag.py checks lakefile.lean imports against it; scripts/status.py lists ready (library, phase) pairs; phases 1,3,4 need dependencies at the same phase. Phases (PLAN/Phase0-7.md): 1 scaffolding from SPEC, 2 review, 3 conformance (#guard, core/ci/local profiles, external oracles with independent expected values, SPEC/testing.md), 4 lean-bench benchmarks with complexity verdicts and external comparators (SPEC/benchmarking.md), 5 fill sorries, 6 polish, 7 Verso manual chapter. Oracles: scripts/oracle/*.py run by scripts/ci/run_oracles.sh (python-flint, cypari2, fpylll, SymPy, nauty, msolve/Singular, GAP); Sage is explicitly not an oracle. Release: scripts/release/released.yml manifest, sync_released.py; mirrors ship source, SPEC, README only. native_decide is banned; @[extern] only for GMP (-lgmp in HexArithNative), CLMUL, lean_int_div_exact, Groebner kernels with Lean fallbacks, and opaque untrusted hooks (fplll) checked by verified certificate checkers."

