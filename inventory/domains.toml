# Sage reference-manual sections at the pinned baseline: the names of the mathematical domains.
# The scope is the whole indexed source; modules outside the manual are counted by package.
# Section routing is stable at this Sage baseline; live coverage is in inventory/coverage.json.

baseline_version = "11.0.beta5"
baseline_commit = "c00171e47d6e68d8148d7ee10c4dd77b71a97662"
