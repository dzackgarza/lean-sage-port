# Sage category framework (sage.categories) mapped onto the lean-categories catalogue.
# Sage: 11.0.beta5, commit c00171e47d6e68d8148d7ee10c4dd77b71a97662 (inventory/sage/index/summary.json).
# Catalogue: lean-categories 3b0167052f3c12424bd9038e88e97f97dcc459b1, lean-cas-dsl dd7ea613495e18772e367798c983b1fdd00c6de1,
#   lean-cas-dsl-leaf-contracts ef3771ddf94a1fcf4d694ae577abb6069b0258e5 (export api/declared-ports.json).
# Surveyed 2026-11-17. One [[category]] per Sage category class (nested axiom and construction classes included),
# one [[operation]] per public method of a ParentMethods/ElementMethods/MorphismMethods/SubcategoryMethods class.
# Order: sets and constructions, magmas to groups, additive structures, rings, modules, algebras, posets,
# enumerated sets, Coxeter groups, crystals, Lie algebras, then the rest. supercategories is the source text of
# super_categories / extra_super_categories / _base_category_class_and_axiom. catalogue ids are export ids.

[[source]]
name = "research-sage-inventory"
url = "https://github.com/dzackgarza/research"
revision = "c4519b27f53ec3b51c34e53984c4eaa2c3909e46"
files = [
    "docs/sage-inventory/Sage-Category-Framework-Inventory.md",
    "docs/sage-inventory/inventory/",
    "writing/data/sage-source-audit-10.9/",
    "writing/data/sage-runtime-10.10.beta0/",
]
sage_version = "10.9 source (commit 686dc1a8d420c2e0aabadd4f602d9a0aa4690c50); 10.10.beta0 runtime"
surveyed = "2026-11-17"
notes = "Editorial judgments taken from it, keyed by top-level class, axiom or construction name: class role (framework helper, test-only and example-only classes are excluded as not-a-category and their methods are infrastructure), axiom status and meaning (WithBasis chosen data; Facade and Endset framework behaviour; Blue and Flying test-only), construction flavor, aliases. The list of classes and methods is this repository's index of the 11.0.beta5 baseline, not the research inventory."

[[category]]
sage = "sage.categories.cartesian_product:CartesianProductsCategory"
mathematics = "Abstract base class for the categories C.CartesianProducts(); it has no objects of its own."
catalogue = ""
relation = "not-a-category"
evidence = "Sage docstring 'An abstract base class for all CartesianProducts categories'; base CovariantConstructionCategory. Research inventory 10.9: role 'framework/helper category class'. Research inventory (dzackgarza/research c4519b2): cartesian_product.CartesianProductsCategory is a framework/helper category class; exclusion, not a capability."
supercategories = []

[[category]]
sage = "sage.categories.category:Category"
mathematics = "Root class of Sage's category framework; each instance models one category, the class itself is not a category."
catalogue = ""
relation = "not-a-category"
evidence = "Sage docstring: 'The base class for modeling mathematical categories'; super_categories returns []. Research inventory 10.9: role 'framework/helper category class'. Research inventory (dzackgarza/research c4519b2): category.Category is a framework/helper category class; exclusion, not a capability."
supercategories = []

