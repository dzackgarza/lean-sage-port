# Sage 11.0.beta5 manual sections `rings_numerical`, `numerical`, and `calculus`.
# These contracts distinguish ordinary estimates from guaranteed enclosures.

domain = "numerical-analysis"

[[capability]]
id = "floating.runtime-precision-real-arithmetic"
title = "Real arithmetic at a precision chosen at run time"
statement = "Given a precision p in bits, a rounding direction, and real inputs represented at that precision, compute rounded field operations and elementary functions."
domain = "Finite-precision real numbers with p >= 2; exceptional values and overflow follow the selected floating format."
contract = "(p : Nat) -> RoundingMode -> RoundedReal p -> RoundedReal p -> RoundedReal p for binary arithmetic; unary operations retain p and the selected rounding mode. Each finite result is the mathematically exact result rounded once according to that mode, subject to the documented operation-specific exception rules. Changing p constructs a distinct arithmetic domain."
exactness = "approximate"
exactness_notes = "Ordinary rounded values do not themselves certify an error interval; an exact rounding contract is required for each operation."
algorithms = [{ family = "Arbitrary-precision binary floating arithmetic and correct rounding", sources = ["Sage real_mpfr.pyx RealField_class, backed by MPFR"] }]
depends_on = []
sage = ["sage.rings.real_mpfr:RealField", "sage.rings.real_mpfr:RealField_class.precision", "sage.rings.real_mpfr:RealField_class.to_prec", "sage.rings.real_mpfr:RealField_class.rounding_mode", "sage.rings.real_mpfr:RealNumber.precision"]
catalogue = []
tests = ["For rational inputs exactly representable at p bits, rounded addition agrees with rational addition when the result is representable", "For a positive rational between two adjacent p-bit values, rounding toward negative and positive infinity returns those respective neighbours"]
reuse = { status = "adaptable", components = ["FloatLib.binary-formats", "FloatLib.certified-transcendentals"], evidence = "FloatLib defines executable formats parameterized by a type-level precision, and a correctly rounded transcendental subset. A run-time p to typed-format representation and generic arithmetic composition remain unverified." }
backends = ["mpfr"]

[[capability]]
id = "interval.real-enclosure-arithmetic"
title = "Real interval arithmetic with guaranteed containment"
statement = "Given bounded real intervals, compute enclosures of arithmetic, elementary functions, intersection and hull while retaining the precision and the containment guarantee."
domain = "Real intervals with specified endpoint arithmetic; functions require their mathematical domains, for example square root on nonnegative inputs."
contract = "Interval p x Interval p -> Interval p for binary operations; Interval p -> Interval p for unary functions; the output contains the set-theoretic image of all inputs. Intersection returns empty when disjoint; hull contains both operands. Endpoints are rounded outward at p bits."
exactness = "approximate"
exactness_notes = "The returned interval is a rigorous enclosure, not an estimate; width may exceed the best possible bound."
algorithms = [{ family = "Directed endpoint rounding and interval evaluation", sources = ["Sage real_mpfi.pyx RealIntervalFieldElement", "Sage real_arb.pyx RealBall"] }]
depends_on = []
sage = ["sage.rings.real_mpfi:RealIntervalField", "sage.rings.real_mpfi:RealIntervalFieldElement.lower", "sage.rings.real_mpfi:RealIntervalFieldElement.upper", "sage.rings.real_mpfi:RealIntervalFieldElement.intersection", "sage.rings.real_mpfi:RealIntervalFieldElement.union", "sage.rings.real_mpfi:RealIntervalFieldElement.sqrt", "sage.rings.real_mpfi:RealIntervalFieldElement.exp", "sage.rings.real_arb:RealBallField", "sage.rings.real_arb:RealBall.contains_exact", "sage.rings.real_arb:RealBall.sqrt"]
catalogue = []
tests = ["For rational x and y contained in input intervals X and Y, exact rational x+y and x*y lie in the corresponding output intervals", "For X = [2,3], the square-root enclosure contains sqrt(2) and sqrt(3), witnessed by squared endpoint inequalities"]
reuse = { status = "adaptable", components = ["leancert.dyadic-interval", "leancert.rat-interval", "leancert.expr-eval-dyadic", "interval.floating", "interval.interval-special-functions"], evidence = "LeanCert supplies proved dyadic and rational containment; girving/interval supplies fixed-width outward-rounded transcendental intervals. Neither surveyed component supplies the full Sage run-time precision and ball contracts." }
backends = ["mpfi", "arb"]

[[capability]]
id = "numerical.real-root-localization"
title = "Locate a real root within a bounded interval"
statement = "Given a continuous real function and a bracket with a sign change, return a root approximation with the requested stopping tolerance; optionally return a certified enclosing interval when an interval extension is available."
domain = "A continuous function on [a,b] with f(a)f(b) <= 0; certification requires an interval extension and sufficient regularity for the selected interval method."
contract = "(f, a, b, tolerance) -> approximation and convergence information for the ordinary numerical path. A certified path returns I subseteq [a,b] with a proved existence assertion and a width bound; a unique-root claim requires a separate uniqueness certificate. Failure to meet a tolerance is explicit."
exactness = "approximate"
exactness_notes = "Sage find_root uses machine-precision Brent search and does not certify an exact root. The certified path is a distinct stronger result and cannot be inferred from a point estimate."
algorithms = [{ family = "Brent bracketing and interval bisection or Newton contraction", sources = ["Sage numerical/optimize.py find_root", "LeanCert RootFinding/Bisection.lean and Newton.lean"] }]
depends_on = ["interval.real-enclosure-arithmetic"]
sage = ["sage.numerical.optimize:find_root"]
catalogue = []
tests = ["For f(x)=x^2-2 on [1,2], an enclosing result contains the positive square root of 2 by endpoint sign inequalities", "For a bracket with f(a)f(b)>0, a method requiring a sign-change proof returns a stated failure instead of a root claim"]
reuse = { status = "adaptable", components = ["leancert.root-finding", "leancert.dyadic-interval"], evidence = "LeanCert proves root existence and exclusion for interval bisection and contraction; the Sage method's point-estimate result and the certified result need separate public contracts." }
backends = ["scipy"]

[[capability]]
id = "numerical.definite-integration"
title = "Approximate or enclose a definite real integral"
statement = "Given an integrable real function and bounds, return either a numerical estimate with a stated error estimate or a certified interval containing the integral."
domain = "Real integrable functions on finite intervals; infinite endpoints and integrable singularities require separate convergence hypotheses and algorithms."
contract = "(f, a, b, absoluteTolerance, relativeTolerance) -> (estimate, errorEstimate) for the Sage-style numerical path. A certified path returns I with integral_a^b f in I and an explicit width or termination condition. Reversing bounds negates the result."
exactness = "approximate"
exactness_notes = "Sage numerical_integral returns an error estimate from GSL quadrature, not a formal bound. LeanCert's interval integral has a containment theorem under its function hypotheses."
algorithms = [{ family = "Adaptive and fixed Gauss-Kronrod quadrature; interval quadrature", sources = ["Sage calculus/integration.pyx numerical_integral", "LeanCert Engine/Integrate.lean"] }]
depends_on = ["interval.real-enclosure-arithmetic"]
sage = ["sage.calculus.integration:numerical_integral", "sage.numerical.gauss_legendre:integrate_vector"]
catalogue = []
tests = ["For f(x)=x^2 on [0,1], the certified interval contains 1/3 and meets its declared width bound", "For a polynomial antiderivative F, an integral enclosure contains exact F(b)-F(a) for run-time rational endpoints"]
reuse = { status = "adaptable", components = ["leancert.integration", "leancert.expr-eval-dyadic"], evidence = "LeanCert has certified uniform and adaptive interval integration. Its accepted function representation and hypotheses must be reconciled with the Sage numerical integration domain; GSL's error estimate is not a containment certificate." }
backends = ["gsl"]
