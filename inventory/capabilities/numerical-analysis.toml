# Sage 11.0.beta5 manual sections `rings_numerical`, `numerical`, and `calculus`.
# These contracts distinguish ordinary estimates from guaranteed enclosures.

domain = "numerical-analysis"

[[capability]]
id = "floating.runtime-precision-real-arithmetic"
title = "Real arithmetic at a precision chosen at run time"
statement = "Given a precision p in bits, a rounding direction, and real inputs represented at that precision, compute rounded field operations and elementary functions."
domain = "Finite-precision real numbers with p >= 2; exceptional values and overflow follow the selected floating format."
contract = "(p : Nat) -> RoundingMode -> RoundedReal p -> RoundedReal p -> RoundedReal p for binary arithmetic; unary operations retain p and the selected rounding mode. Each finite result is the mathematically exact result rounded once according to that mode, subject to the documented operation-specific exception rules. Changing p constructs a distinct arithmetic domain."
exactness = "approximate"
exactness_notes = "Ordinary rounded values do not themselves certify an error interval; an exact rounding contract is required for each operation."
algorithms = [{ family = "Arbitrary-precision binary floating arithmetic and correct rounding", sources = ["Sage real_mpfr.pyx RealField_class, backed by MPFR"] }]
depends_on = []
sage = ["sage.rings.real_mpfr:RealField", "sage.rings.real_mpfr:RealField_class.precision", "sage.rings.real_mpfr:RealField_class.to_prec", "sage.rings.real_mpfr:RealField_class.rounding_mode", "sage.rings.real_mpfr:RealNumber.precision"]
catalogue = []
tests = ["src/sage/rings/real_mpfr.pyx: RealField_class.__init__ doctests construct 17- and 100000-bit fields and each MPFR rounding mode; compare native results at the same precision and rounding mode against Sage/MPFR"]
reuse = { status = "adaptable", components = ["FloatLib.binary-formats", "FloatLib.certified-transcendentals"], evidence = "FloatLib defines executable formats parameterized by a type-level precision, and a correctly rounded transcendental subset. A run-time p to typed-format representation and generic arithmetic composition remain unverified." }
backends = ["mpfr"]
references = []

[[capability]]
id = "interval.real-enclosure-arithmetic"
title = "Real interval arithmetic with guaranteed containment"
statement = "Given bounded real intervals, compute enclosures of arithmetic, elementary functions, intersection and hull while retaining the precision and the containment guarantee."
domain = "Real intervals with specified endpoint arithmetic; functions require their mathematical domains, for example square root on nonnegative inputs."
contract = "Interval p x Interval p -> Interval p for binary arithmetic; Interval p -> Interval p for unary functions; the output contains the set-theoretic image of all inputs. Intersection is a partial operation: it returns the common interval when the inputs overlap and reports failure when they are disjoint. Hull contains both operands. Endpoints are rounded outward at p bits."
exactness = "approximate"
exactness_notes = "The returned interval is a rigorous enclosure, not an estimate; width may exceed the best possible bound."
algorithms = [{ family = "Directed endpoint rounding and interval evaluation", sources = ["Sage real_mpfi.pyx RealIntervalFieldElement", "Sage real_arb.pyx RealBall"] }]
depends_on = []
sage = ["sage.rings.real_mpfi:RealIntervalField", "sage.rings.real_mpfi:RealIntervalFieldElement.lower", "sage.rings.real_mpfi:RealIntervalFieldElement.upper", "sage.rings.real_mpfi:RealIntervalFieldElement.intersection", "sage.rings.real_mpfi:RealIntervalFieldElement.union", "sage.rings.real_mpfi:RealIntervalFieldElement.sqrt", "sage.rings.real_mpfi:RealIntervalFieldElement.exp", "sage.rings.real_arb:RealBallField", "sage.rings.real_arb:RealBall.contains_exact", "sage.rings.real_arb:RealBall.sqrt"]
catalogue = []
tests = ["src/sage/rings/real_mpfi.pyx: RealIntervalFieldElement.intersection and union doctests cover overlap, disjoint failure and convex hull; compare containment and endpoint direction against Sage at the same precision"]
reuse = { status = "adaptable", components = ["leancert.dyadic-interval", "leancert.rat-interval", "leancert.expr-eval-dyadic", "interval.floating", "interval.interval-special-functions"], evidence = "LeanCert supplies proved dyadic and rational containment; girving/interval supplies fixed-width outward-rounded transcendental intervals. Neither surveyed component supplies the full Sage run-time precision and ball contracts." }
backends = ["mpfi", "arb"]
references = []

[[capability]]
id = "numerical.real-root-localization"
title = "Locate a real root within a bounded interval"
statement = "Given a real function and a bounded search interval, return a machine-precision root estimate when the numerical search converges."
domain = "A real-valued function evaluable at machine precision on enough of the search interval for Brent's method; a sign-change bracket is the ordinary successful case."
contract = "(f, a, b, absoluteTolerance, relativeTolerance, maxIterations) -> root estimate and optional convergence information. The result is a machine-precision point estimate; failure to meet convergence conditions or to find a usable bracket is explicit."
exactness = "approximate"
exactness_notes = "Sage find_root uses machine-precision Brent search. Its stopping tolerance and convergence information do not certify an exact root."
algorithms = [{ family = "Brent bracketing", sources = ["Sage numerical/optimize.py find_root"] }]
depends_on = []
sage = ["sage.numerical.optimize:find_root"]
catalogue = []
tests = ["src/sage/numerical/optimize.py: find_root doctests include polynomial roots, an undefined endpoint, a Brent failure and an all-NaN interval; compare native estimates and failure status with Sage at matching machine precision and tolerances"]
reuse = { status = "adaptable", components = ["leancert.root-finding"], evidence = "LeanCert implements bisection with stronger interval guarantees, but the surveyed map does not show a compiled Brent implementation. Reuse requires a point-estimate interface with Sage's machine-precision stopping behavior." }
backends = ["scipy"]
references = []

[[capability]]
id = "numerical.definite-integration"
title = "Estimate a definite real integral"
statement = "Given an integrable real function and bounds, return a numerical estimate with an error estimate."
domain = "Real integrable functions on finite intervals; infinite endpoints and integrable singularities require the convergence hypotheses of the selected quadrature rule."
contract = "(f, a, b, absoluteTolerance, relativeTolerance, rule) -> (estimate, errorEstimate). The second output is the quadrature algorithm's error estimate, not a certified bound. Reversing bounds negates the integral estimate."
exactness = "approximate"
exactness_notes = "Sage numerical_integral returns an error estimate from GSL quadrature, not a formal bound."
algorithms = [{ family = "Adaptive and fixed Gauss-Kronrod quadrature", sources = ["Sage calculus/integration.pyx numerical_integral"] }]
depends_on = []
sage = ["sage.calculus.integration:numerical_integral"]
catalogue = []
tests = ["src/sage/calculus/integration.pyx: numerical_integral doctests cover the default and qags modes, a changed Gauss rule and the returned estimate/error-estimate pair; compare both outputs with Sage under matching rule and tolerances"]
reuse = { status = "adaptable", components = ["leancert.integration"], evidence = "LeanCert provides certified uniform and adaptive interval integration, but its function representation and enclosure output differ from the GSL estimate and error estimate. Adaptation must preserve the stated output contract." }
backends = ["gsl"]
references = []
