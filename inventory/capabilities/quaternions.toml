[[capability]]
id = "quaternions.coordinates"
title = "Quaternion algebra elements and basis coordinates"
statement = "Construct elements of (a,b) over a field and recover their coefficients in the chosen basis 1,i,j,ij."
domain = "Quaternion algebras over a field of characteristic other than two, including Q and number fields."
contract = "(a,b,x0,x1,x2,x3) -> x0+x1*i+x2*j+x3*ij with i^2=a, j^2=b, ij=-ji; retain base field, a,b and basis. Coordinate extraction is inverse to construction."
exactness = "exact"
algorithms = [{ family = "Four-coordinate quaternion representation", sources = ["sage.algebras.quatalg.quaternion_algebra_element:QuaternionAlgebraElement_generic", "Mathlib/Algebra/Quaternion.lean"] }]
depends_on = []
