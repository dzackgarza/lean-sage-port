catalogue = []
tests = ["Sage doctests: sage.algebras.quatalg.quaternion_algebra_element:QuaternionAlgebraElement_generic and QuaternionAlgebraElement_abstract.coefficient_tuple; compare four coefficients in the same chosen basis."]
reuse = { status = "reusable", components = ["mathlib.alg.quaternions"], evidence = "Mathlib QuaternionAlgebra is a computable four-coordinate type with ring operations; the survey ran integer and rational products. Sage's chosen parameters and basis must be retained." }
backends = []
references = []

