# Manual section `finite_rings` (Finite Rings).

domain = "finite-rings"

[[capability]]
id = "modular.multiplicative-order"
title = "Multiplicative order of a unit modulo an integer"
statement = "Given n >= 1 and a coprime to n, return the least e >= 1 with a^e = 1 mod n."
domain = "Units of Z/n; more generally an element of a finite group with a known multiple of its order."
contract = "(Z/n)^* -> Z_{>0}. The result divides lambda(n)."
exactness = "exact"
algorithms = [
  { family = "Removal of prime factors from a multiple of the order", sources = ["[Coh1993] section 1.4.1"] },
]
depends_on = ["integers.factorization", "integers.modular-power", "integers.multiplicative-functions"]
sage = ["sage.rings.finite_rings.integer_mod:IntegerMod_abstract.multiplicative_order"]
catalogue = []
tests = [
  "a^e = 1 mod n and a^(e/q) != 1 mod n for each prime q dividing e",
  "The order divides phi(n); for a primitive root it equals phi(n)",
]
reuse = { status = "adaptable", components = ["hex.HexIntFactor.multiplicative-order", "mathlib.zmod.units"], evidence = "Hex has multiplicative-order certificates from a checked factorization; the theory library proves agreement with Mathlib's `orderOf` in (ZMod n)ˣ." }
backends = ["pari"]
references = ["Coh1993"]

[[capability]]
id = "finite-rings.modular-integer-rings"
title = "Modular integer rings and elements"
statement = "Construct Z/nZ rings and executable modular elements with arithmetic, units, orders, roots, CRT, valuations and finite-ring factorization data."
domain = "A positive modulus n and modular integer values, with factorization or primality hypotheses where required."
contract = "n -> finite quotient ring Z/nZ with canonical coercions and exact arithmetic; unit-group, order, root, CRT and polynomial invariants agree with modular arithmetic."
exactness = "exact"
exactness_notes = "Core modular operations are exact; root, logarithm and factorization algorithms require their documented existence or factorization assumptions."
algorithms = [{ family = "Modular element arithmetic, CRT, roots and unit groups", sources = ["sage.rings.finite_rings.integer_mod:*", "sage.rings.finite_rings.integer_mod_ring:*", "sage.rings.finite_rings.element_base:*"] }]
depends_on = []
sage = ["sage.rings.finite_rings.integer_mod:*", "sage.rings.finite_rings.integer_mod_ring:*", "sage.rings.finite_rings.element_base:*"]
catalogue = []
tests = [
  "Ring arithmetic and quotient cardinality checks.",
  "CRT reconstruction and modular valuation checks.",
  "Unit-group order/generator and multiplicative-order checks.",
  "Square/nth-root and polynomial invariant checks where solutions exist.",
]
reuse = { status = "adaptable", components = ["mathlib.zmod.arithmetic", "mathlib.zmod.units", "mathlib.int.crt", "mathlib.int.factorization"], evidence = "Mathlib supplies ZMod arithmetic, units, CRT and integer factorization; Sage's executable parent/element backends, roots, logarithms and conversion protocols require native implementations." }
backends = ["pari", "gmp"]
references = []

[[capability]]
id = "finite-rings.finite-field-realizations"
title = "Finite fields and backend-specific field elements"
statement = "Construct prime and extension finite fields with polynomial, Givaro, NTL and PARI representations, including field arithmetic, Frobenius, generators, logarithms and byte/vector conversions."
domain = "A prime-power order q, field generator name and optional defining modulus or backend implementation."
contract = "q and modulus -> finite field of cardinality q and characteristic p; all backend representations implement field operations, coercions, Frobenius and multiplicative-group invariants consistently."
exactness = "conditional"
exactness_notes = "Field arithmetic is exact; backend availability, modulus selection and discrete-log operations depend on the selected implementation and required factorizations."
algorithms = [{ family = "Prime/extension finite-field construction and backend element arithmetic", sources = ["sage.rings.finite_rings.finite_field_base:*", "sage.rings.finite_rings.finite_field_constructor:*", "sage.rings.finite_rings.finite_field_prime_modn:*", "sage.rings.finite_rings.finite_field_givaro:*", "sage.rings.finite_rings.finite_field_ntl_gf2e:*", "sage.rings.finite_rings.finite_field_pari_ffelt:*", "sage.rings.finite_rings.element_givaro:*", "sage.rings.finite_rings.element_ntl_gf2e:*", "sage.rings.finite_rings.element_pari_ffelt:*"] }]
depends_on = ["finite-rings.modular-integer-rings"]
sage = ["sage.rings.finite_rings.finite_field_base:*", "sage.rings.finite_rings.finite_field_constructor:*", "sage.rings.finite_rings.finite_field_prime_modn:*", "sage.rings.finite_rings.finite_field_givaro:*", "sage.rings.finite_rings.finite_field_ntl_gf2e:*", "sage.rings.finite_rings.finite_field_pari_ffelt:*", "sage.rings.finite_rings.element_givaro:*", "sage.rings.finite_rings.element_ntl_gf2e:*", "sage.rings.finite_rings.element_pari_ffelt:*"]
catalogue = []
tests = [
  "Cardinality, characteristic, degree and defining-polynomial checks.",
  "Backend-independent addition/multiplication/coercion and Frobenius checks.",
  "Multiplicative generator/order and discrete-log round trips where supported.",
  "Vector, polynomial and byte conversion round trips.",
]
reuse = { status = "adaptable", components = ["mathlib.ff.galois-field", "mathlib.ff.executable-gfpn", "mathlib.ff.finite-field-theory", "mathlib.zmod.arithmetic"], evidence = "Mathlib supplies finite-field theory and executable prime/extension field arithmetic; Sage's multiple backend representations, parent factories and conversion bridges require native implementations." }
backends = ["pari", "ntl", "givaro"]
references = []

[[capability]]
id = "finite-rings.extensions-and-homomorphisms"
title = "Finite-field extensions, residue fields, closures and homomorphisms"
statement = "Construct residue fields and algebraic closures of finite fields, Conway polynomial systems, finite-field homsets, embeddings, sections and Frobenius endomorphisms."
domain = "A finite-field or residue-field construction with compatible characteristic/degree data and optional Conway database."
contract = "Field/extension data -> canonical reduction/lifting and homomorphism maps; finite-field homsets enumerate the valid embeddings, Frobenius powers compose with the stated order, and Conway systems satisfy compatibility checks."
exactness = "conditional"
exactness_notes = "Finite maps and field operations are exact; algebraic-closure enumeration and Conway-lattice construction depend on finite degree bounds and database availability."
algorithms = [{ family = "Residue reduction/lifting, finite-field maps, Frobenius and Conway compatibility", sources = ["sage.rings.algebraic_closure_finite_field:*", "sage.rings.finite_rings.residue_field:*", "sage.rings.finite_rings.conway_polynomials:*", "sage.rings.finite_rings.hom_finite_field:*", "sage.rings.finite_rings.hom_finite_field_givaro:*", "sage.rings.finite_rings.hom_prime_finite_field:*", "sage.rings.finite_rings.homset:*"] }]
depends_on = ["finite-rings.finite-field-realizations"]
sage = ["sage.rings.algebraic_closure_finite_field:*", "sage.rings.finite_rings.residue_field:*", "sage.rings.finite_rings.conway_polynomials:*", "sage.rings.finite_rings.hom_finite_field:*", "sage.rings.finite_rings.hom_finite_field_givaro:*", "sage.rings.finite_rings.hom_prime_finite_field:*", "sage.rings.finite_rings.homset:*"]
catalogue = []
tests = [
  "Residue reduction/lift and section composition checks.",
  "Finite-field homomorphism injectivity, surjectivity and inverse-image checks.",
  "Frobenius order, fixed-field and composition checks.",
  "Conway polynomial consistency and algebraic-closure finite-degree checks.",
]
reuse = { status = "adaptable", components = ["mathlib.ff.finite-field-theory", "mathlib.ff.galois-field", "mathlib.poly.gcd", "mathlib.zmod.arithmetic"], evidence = "Mathlib supplies finite-field theory, Galois fields, polynomial gcd and modular arithmetic; Sage's residue maps, closure/conway systems and backend homset enumeration require native implementations." }
backends = ["pari", "ntl", "givaro"]
references = []
