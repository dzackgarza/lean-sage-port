catalogue = ["cat.sets", "cat.enumerated_sets"]
tests = [
  "Sage doctests for tuple membership, iteration, cardinality and disjoint-union tags.",
  "Independent finite-product oracle: compare generated tuples/tags with itertools.product and a tagged-sum reference implementation.",
]
reuse = { status = "adaptable", components = ["catalogue.cat.sets", "catalogue.cat.enumerated_sets"], evidence = "The catalogue provides sets and enumerated sets; canonical tuple/tag representation and finite enumeration remain native obligations." }
backends = []
references = []

