tests = [
  "Sage doctests for list/dictionary/function families, lazy evaluation, infinite integer indices, hidden keys, iteration and cardinality.",
  "Independent family oracle: compare finite key/value lookup and iteration with a dictionary or generated function.",
]
reuse = { status = "adaptable", components = ["catalogue.cat.sets", "catalogue.cat.enumerated_sets"], evidence = "The catalogue supplies the underlying carrier categories; family evaluation, hidden keys and laziness are native data-structure obligations." }
