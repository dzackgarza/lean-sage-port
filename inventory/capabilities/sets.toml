# Set constructions and enumerated-set carriers read from Sage 11.0.beta5,
# c00171e47d6e68d8148d7ee10c4dd77b71a97662.

domain = "sets"

[[capability]]
id = "sets.finite-enumeration"
title = "Finite enumerated set construction"
statement = "Construct a finite enumerated carrier from a finite iterable while retaining its ordered enumeration, membership, cardinality, first and last elements, and parent structure."
domain = "A finite iterable of elements."
contract = "X -> S, where S is a finite enumerated parent whose iteration and list preserve the supplied order, membership tests the stored elements, and cardinality is the number of entries including repeated entries when Sage models a multiset."
exactness = "exact"
algorithms = [{ family = "Materialized finite enumeration", sources = ["sage.sets.finite_enumerated_set:FiniteEnumeratedSet", "sage.sets.set_from_iterator:EnumeratedSetFromIterator"] }]
depends_on = []
sage = ["sage.sets.finite_enumerated_set:*", "sage.sets.set_from_iterator:*"]
catalogue = ["cat.enumerated_sets"]
tests = [
  "Sage doctests for FiniteEnumeratedSet: order-sensitive iteration, membership, cardinality, first/last and empty-set behavior.",
  "Independent finite-list oracle: compare list, membership and cardinality with the input tuple for runtime-generated inputs.",
]
reuse = { status = "adaptable", components = ["catalogue.cat.enumerated_sets"], evidence = "The catalogue has the enumerated-sets carrier; the ordered-parent and repeated-entry behavior requires a native finite enumeration representation." }
backends = []
references = []

[[capability]]
id = "sets.integer-progressions"
title = "Finite and infinite integer progression sets"
statement = "Construct finite or infinite arithmetic progressions of integers with inclusive lower and exclusive upper bounds, signed step, optional middle-point enumeration, membership, ranking and unranking."
domain = "Integer bounds in Z or infinities, nonzero integer step, and an optional middle point lying in the progression."
contract = "(begin,end,step,middle_point) -> S with exact progression membership, finite cardinality when bounded, lazy enumeration when unbounded, and rank/unrank on the documented enumerated-set interface."
exactness = "exact"
algorithms = [{ family = "Normalized arithmetic progression enumeration", sources = ["sage.sets.integer_range:IntegerRange", "sage.sets.integer_range:IntegerRangeFinite", "sage.sets.integer_range:IntegerRangeInfinite"] }]
depends_on = []
sage = ["sage.sets.integer_range:*", "sage.sets.positive_integers:*"]
catalogue = ["cat.enumerated_sets"]
tests = [
  "Sage doctests compare finite IntegerRange iteration with Python range for positive and negative steps and test infinite iteration.",
  "Independent progression oracle: for generated finite bounds, compare membership, sorted elements and cardinality with the integer arithmetic definition.",
]
reuse = { status = "adaptable", components = ["catalogue.cat.enumerated_sets"], evidence = "The enumerated-set carrier is available; exact integer progression normalization, infinite lazy iteration and rank/unrank are native obligations." }
backends = []
references = []

[[capability]]
id = "sets.nonnegative-integer-carrier"
title = "Nonnegative integer enumerated carrier"
statement = "Provide the enumerated set of nonnegative integers as a facade over integer elements, with exact membership, coercion and lazy enumeration."
domain = "The integer ring Z."
contract = "NN -> S whose elements are exactly integers n >= 0, whose constructor rejects negative or nonintegral values, and whose enumeration begins 0,1,2,... without materializing the infinite set."
exactness = "exact"
algorithms = [{ family = "Predicate-backed lazy integer enumeration", sources = ["sage.sets.non_negative_integers:NonNegativeIntegers"] }]
depends_on = ["sets.integer-progressions"]
sage = ["sage.sets.non_negative_integers:*"]
catalogue = ["cat.enumerated_sets"]
tests = [
  "Sage doctests test membership, coercion rejection, cardinality, first element and the first several iterator values.",
  "Independent predicate oracle: generated integer inputs satisfy membership exactly when n >= 0.",
]
reuse = { status = "adaptable", components = ["catalogue.cat.enumerated_sets"], evidence = "The catalogue supplies the enumerated-set carrier; the facade-to-Z coercion and nonnegative predicate are explicit native behavior." }
backends = []
references = []

[[capability]]
