catalogue = []
tests = [
  "Degree-preserving map and graded relation checks.",
  "Matrix morphism composition, kernel/image and homspace checks.",
  "Tensor-operation associativity and diamond-cutting identities.",
  "Steenrod-module action relations on documented generators.",
]
reuse = { status = "adaptable", components = ["mathlib.linalg.matrix-arithmetic", "mathlib.data.finsupp"], evidence = "Matrix and finitely-supported-coordinate foundations are reusable; Sage's finitely presented graded normal forms, Steenrod wrappers and combinatorial tensor helpers need native adapters." }
