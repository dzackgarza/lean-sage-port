references = []

[[capability]]
id = "modules.vector-backends"
title = "Dense, sparse, modular, rational, real and complex vector backends"
statement = "Provide executable vector arithmetic over integer, modular, rational, real, complex, symbolic, NumPy and double-precision representations."
domain = "A supported scalar domain and vector length, with dense/sparse or external numeric storage selected by the backend."
contract = "Backend and length -> vector space with coordinatewise operations, coercions, equality and scalar products consistent with the scalar domain; approximate backends state their precision semantics."
exactness = "conditional"
exactness_notes = "Integer, rational and modular backends are exact; real, complex, symbolic and NumPy/double backends may be approximate or symbolic according to their scalar representation."
algorithms = [{ family = "Specialized vector storage and arithmetic kernels", sources = ["sage.modules.vector_integer_dense:*", "sage.modules.vector_mod2_dense:*", "sage.modules.vector_modn_dense:*", "sage.modules.vector_rational_dense:*", "sage.modules.vector_real_double_dense:*", "sage.modules.vector_complex_double_dense:*", "sage.modules.vector_double_dense:*", "sage.modules.vector_numpy_dense:*", "sage.modules.vector_numpy_integer_dense:*", "sage.modules.vector_symbolic_dense:*", "sage.modules.vector_symbolic_sparse:*", "sage.modules.vector_callable_symbolic_dense:*", "sage.modules.numpy_util:*"] }]
depends_on = ["modules.free-and-quotient"]
sage = ["sage.modules.vector_integer_dense:*", "sage.modules.vector_mod2_dense:*", "sage.modules.vector_modn_dense:*", "sage.modules.vector_rational_dense:*", "sage.modules.vector_real_double_dense:*", "sage.modules.vector_complex_double_dense:*", "sage.modules.vector_double_dense:*", "sage.modules.vector_numpy_dense:*", "sage.modules.vector_numpy_integer_dense:*", "sage.modules.vector_symbolic_dense:*", "sage.modules.vector_symbolic_sparse:*", "sage.modules.vector_callable_symbolic_dense:*", "sage.modules.numpy_util:*"]
catalogue = []
tests = [
  "Exact backend arithmetic and coercion round trips.",
  "Modular vector arithmetic and finite-cardinality checks.",
  "Dense/sparse conversion and coordinate equality checks.",
  "Approximate backend error/precision behavior on documented operations.",
]
reuse = { status = "adaptable", components = ["mathlib.linalg.matrix-arithmetic", "lean-core.data.array"], evidence = "Mathlib/Lean supply array and matrix primitives; Sage's specialized vector storage, Cython kernels and NumPy/double interfaces require native implementations." }
backends = ["gmp", "numpy"]
references = []
