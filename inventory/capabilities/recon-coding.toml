domain = "coding"

[[capability]]
id = "recon-coding.documented-source-families"
title = "Finite-field error-correcting codes and decoding"
statement = "Represent linear and nonlinear error-correcting codes over finite alphabets and metrics, with generator/parity-check structure, encoding, decoding, distance and bounds, and specialized cyclic, BCH, Reed-Solomon, Reed-Muller, Goppa, rank-metric and algebraic-geometry families."
domain = "Finite fields and finite alphabets, code length/dimension, generator or parity-check data, Hamming or rank metrics, received words and decoder promises."
contract = "Code/family parameters -> code object; message -> codeword via an encoder; received word -> codeword/message/list subject to the decoder type and radius; invariants -> distance, weight enumerator, duality and bounds."
exactness = "conditional"
exactness_notes = "Exactness, approximation and external-backend behavior follow each source family's documented contract."
algorithms = [{ family = "Code construction, encoding, decoding and distance algorithms", sources = ["sage.coding.abstract_code:*", "sage.coding.ag_code:*", "sage.coding.ag_code_decoders:*", "sage.coding.bch_code:*", "sage.coding.binary_code:*", "sage.coding.channel:*", "sage.coding.code_bounds:*", "sage.coding.code_constructions:*", "sage.coding.codecan.autgroup_can_label:*", "sage.coding.codecan.codecan:*", "sage.coding.cyclic_code:*", "sage.coding.databases:*", "sage.coding.decoder:*", "sage.coding.delsarte_bounds:*", "sage.coding.encoder:*", "sage.coding.extended_code:*", "sage.coding.gabidulin_code:*", "sage.coding.golay_code:*", "sage.coding.goppa_code:*", "sage.coding.grs_code:*", "sage.coding.guava:*", "sage.coding.guruswami_sudan.gs_decoder:*", "sage.coding.guruswami_sudan.interpolation:*", "sage.coding.guruswami_sudan.utils:*", "sage.coding.hamming_code:*", "sage.coding.information_set_decoder:*", "sage.coding.kasami_codes:*", "sage.coding.linear_code:*", "sage.coding.linear_code_no_metric:*", "sage.coding.linear_rank_metric:*", "sage.coding.parity_check_code:*", "sage.coding.punctured_code:*", "sage.coding.reed_muller_code:*", "sage.coding.self_dual_codes:*", "sage.coding.source_coding.huffman:*", "sage.coding.subfield_subcode:*"] }]
