[[capability]]
id = "semirings.tropical-matrix-closure"
title = "Tropical matrix path closure"
statement = "Compute the convergent tropical sum of positive matrix powers, optionally with identity."
domain = "Square matrices over a min-plus or max-plus tropical semiring with exact ordered-group base; report a cycle that makes the sum unbounded."
contract = "A -> A+ A^2+... (weak) or I+A+A^2+... (strong), entrywise in the tropical semiring. Preserve the matrix's vertex indices and base convention."
exactness = "exact"
algorithms = [{ family = "Floyd-Warshall closure", sources = ["sage.rings.semirings.tropical_matrix:Matrix_tropical_dense.weak_transitive_closure", "[But2010] Algorithm 1.6.21"] }]
depends_on = ["semirings.tropical-construction", "matrices.arithmetic"]
sage = ["sage.rings.semirings.tropical_matrix:Matrix_tropical_dense.weak_transitive_closure", "sage.rings.semirings.tropical_matrix:Matrix_tropical_dense.strong_transitive_closure"]
catalogue = []
tests = ["Sage doctests: sage.rings.semirings.tropical_matrix:Matrix_tropical_dense.weak_transitive_closure and strong_transitive_closure; compare each entry and the unbounded-cycle result at the same min/max convention."]
reuse = { status = "missing", components = [], evidence = "The inspected reuse maps contain neither a generic tropical matrix closure producer nor its unbounded-cycle contract. Hex's future graph shortest-path entry is a specification, not this operation." }
backends = []
references = ["But2010"]

