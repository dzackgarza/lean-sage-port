sage = ["sage.rings.semirings.tropical_semiring:TropicalSemiringElement.multiplicative_order"]
catalogue = []
tests = ["Sage doctests: sage.rings.semirings.tropical_semiring:TropicalSemiringElement.multiplicative_order; compare the identity and absorbing infinity cases."]
reuse = { status = "missing", components = [], evidence = "The inspected reuse maps have no tropical-element order producer; decidable equality of the base provides the direct algorithm once the tropical representation exists." }
