reuse = { status = "adaptable", components = ["mathlib.zmod.arithmetic", "hex.HexModArith.zmod64", "mathlib.alg.ideal-quotient"], evidence = "`ZMod n` and Hex's `ZMod64` are executable for R = Z with n known when the type is formed. Mathlib's `Ideal.Quotient` is a quotient type with no normal form. A quotient by an ideal chosen at run time needs the runtime-object probe of the architecture phase." }
backends = []
references = ["Lan2002", "CLO2015"]

[[capability]]
id = "rings.residue-field"
title = "Residue field of a ring at a prime ideal"
statement = "Given a commutative ring R and a prime ideal P with a computable test, construct the field Frac(R/P) with the reduction map from the localization R_P and a lifting map back to R. For R = Z and P = (p) the result is F_p; for R = Q and a prime p the reduction map is defined on the rationals with denominator prime to p."
domain = "Commutative rings with a computable prime ideal; here Z and Q at a rational prime."
contract = "(R, P) -> (Field k, partial RingHom R_P -> k, lift k -> R) with the lift a section of the reduction."
exactness = "exact"
algorithms = [
  { family = "Quotient by a maximal ideal; inversion of denominators in the residue field", sources = ["[Neu1999] chapter I section 8"] },
]
depends_on = ["rings.quotient-ring", "integers.primality-proving", "integers.modular-inverse"]
sage = [
  "sage.rings.integer_ring:IntegerRing_class.residue_field",
  "sage.rings.rational_field:RationalField.residue_field",
]
catalogue = []
tests = [
  "The reduction Z -> F_p is a ring homomorphism with kernel pZ; the lift composed with the reduction is the identity",
  "The reduction of a/b with p not dividing b equals a b^-1 in F_p; rationals with p in the denominator are rejected",
  "A composite modulus is rejected",
]
reuse = { status = "adaptable", components = ["mathlib.zmod.arithmetic", "hex.HexModArith.prime-field"], evidence = "`ZMod p` with `Fact p.Prime` and Hex's prime field structure on `ZMod64` are executable; the reduction map from the localization is a wrapper." }
backends = []
references = ["Neu1999"]

[[capability]]
id = "rings.completion"
title = "Completion of a ring at a place"
statement = "Given Z or Q and a place (a prime p or the real place) with a precision, construct the completion: Z_p or Q_p to the given p-adic precision, or the real numbers to the given precision, with the canonical map into it."
domain = "The rings Z and Q with their places; the general statement is for a ring with a valuation or an absolute value."
contract = "(R, place, precision) -> (Ring C, RingHom R C). The image of R is dense, and the map is an isometry for the absolute value of the place."
exactness = "approximate"
exactness_notes = "Elements of the completion carry a finite precision. The record of the construction is exact; arithmetic in the result has the exactness of the p-adic or real model chosen."
algorithms = [
  { family = "Inverse limit of Z/p^n; Cauchy completion", sources = ["[Neu1999] chapter II sections 1 to 4", "[Ser1973] chapter II"] },
]
depends_on = ["rings.quotient-ring", "integers.valuation", "valuations.padic-valuation-object"]
sage = [
  "sage.rings.integer_ring:IntegerRing_class.completion",
  "sage.rings.rational_field:RationalField.completion",
]
catalogue = []
tests = [
  "The image of n in Z_p to precision k is n mod p^k, and the map is a ring homomorphism",
  "The p-adic absolute value of the image of q equals p^(-v_p(q))",
  "Hensel: x^2 = 2 has a root in Z_7 to any requested precision and none in Z_5",
]
reuse = { status = "specified-unimplemented", components = ["hex.spec.hex-padics", "hex.future.exact-padics", "mathlib.padic.numbers", "leancert.rat-interval"], evidence = "Mathlib's `Padic` and `Real` are Cauchy completions and are not executable. Hex has a specification for capped-precision p-adic numbers that is not implemented. LeanCert has executable real intervals." }
backends = ["mpfr", "pari"]
references = ["Neu1999", "Ser1973"]

[[capability]]
id = "rings.extension-by-polynomial"
title = "Extension of a ring by a root of a polynomial"
statement = "Given a commutative ring R and a monic polynomial f in R[x], construct R[x]/(f) with the map R -> R[x]/(f) and the distinguished root of f. For R = Z and f irreducible the result is an order of a number field; for R = Q and f irreducible it is a number field. A list of polynomials gives a tower."
domain = "Commutative rings with computable arithmetic and a monic f; irreducible f for a domain or a field."
contract = "(R, f) -> (Ring S, RingHom R S, root in S) with the universal property: a ring map R -> T and a root of f in T determine a unique map S -> T."
exactness = "exact"
algorithms = [
  { family = "Residues of polynomials of degree below deg f, with reduction by division with remainder", sources = ["[Lan2002] chapter IV section 1", "[Coh1993] section 4.2"] },
]
depends_on = ["rings.quotient-ring", "polynomials.univariate-arithmetic"]
sage = [
  "sage.rings.integer_ring:IntegerRing_class.extension",
  "sage.rings.rational_field:RationalField.extension",
]
catalogue = ["obj.commutative_rings.polynomial_quotient"]
tests = [
  "The distinguished root satisfies f, for a run-time monic f over Z",
  "The universal property: Z[x]/(x^2 + 1) -> Z/5 exists for each of the roots 2 and 3 of x^2 + 1, and sends the root to it",
  "The norm from Q[x]/(x^2 - d) to Q of a + b sqrt(d) is a^2 - d b^2",
]
reuse = { status = "formalized-not-executable", components = ["mathlib.alg.adjoin-root"], evidence = "Mathlib's `AdjoinRoot` is a quotient of a noncomputable polynomial type. Hex's executable polynomial and finite-field quotients cover F_p[x]/(f); the construction over a run-time ring is the subject of an architecture probe." }
backends = ["pari", "ntl", "flint"]
references = ["Lan2002", "Coh1993"]

[[capability]]
id = "fields.algebraic-closure"
title = "Algebraic closure of a field"
statement = "Given a field K with computable arithmetic and polynomial factorization, construct an algebraic closure with exact arithmetic and a decidable equality: each element is given by a polynomial over K and data that selects one root. For K = Q the result is the field of algebraic numbers, with its real subfield ordered."
domain = "Fields with computable polynomial factorization; here Q."
contract = "Field K -> (Field L, RingHom K L) with L algebraically closed and algebraic over K. Equality and, for real algebraic numbers, the order are decided exactly."
exactness = "exact"
exactness_notes = "Elements are exact. Numerical enclosures are used to select roots and are refined until a comparison is decided."
algorithms = [
  { family = "Minimal polynomial with an isolating interval or disc; arithmetic by resultants and factorization", sources = ["[Coh1993] section 4.2", "[GG2013] chapter 6 (resultants)"] },
  { family = "Lazy towers of number fields with interval arithmetic", sources = ["The module documentation of `sage.rings.qqbar` in the baseline checkout"] },
]
depends_on = ["rings.extension-by-polynomial", "polynomials.univariate-arithmetic", "integers.factorization"]
sage = ["sage.rings.rational_field:RationalField.algebraic_closure"]
catalogue = []
tests = [
  "sqrt(2) sqrt(3) = sqrt(6) and (sqrt(2) + sqrt(3))^4 - 10 (sqrt(2) + sqrt(3))^2 + 1 = 0, decided exactly",
  "Every run-time monic f in Z[x] of degree d has d roots counted with multiplicity, and their product is (-1)^d f(0)",
  "The real roots are ordered consistently with rational approximations",
]
reuse = { status = "adaptable", components = ["hex.HexRealRoots.real-root-isolation", "mathlib.alg.adjoin-root"], evidence = "Hex has real root isolation for integer polynomials. Mathlib's `AlgebraicClosure` is not executable. Arithmetic of algebraic numbers by resultants is not in a surveyed library." }
backends = ["flint", "pari", "arb"]
references = ["Coh1993", "GG2013"]

[[capability]]
id = "valuations.padic-valuation-object"
title = "The p-adic valuation as a discrete valuation on Z and Q"
statement = "Given a prime p, the p-adic valuation as an object: a function v: Q -> Z with +infinity at 0 that satisfies v(a b) = v(a) + v(b) and v(a + b) >= min(v(a), v(b)), with its uniformizer p, value group Z, residue field F_p, reduction map on the valuation ring and lift from the residue field. It is the base of extensions of valuations to polynomial rings and number fields."
domain = "Z and Q with a rational prime p; the general statement is a discrete valuation on a field."
contract = "prime -> valuation object with: evaluation Q -> Z or +infinity, uniformizer, residue field, reduce: {v >= 0} -> F_p, lift: F_p -> Z, restriction to Z and extension to Q."
exactness = "exact"
algorithms = [
  { family = "Evaluation by `integers.valuation`; reduction by `rings.residue-field`", sources = ["[Neu1999] chapter II section 3", "[Mac1936]"] },
]
depends_on = ["integers.valuation", "rings.residue-field", "integers.primality-proving"]
sage = [
  "sage.rings.integer_ring:IntegerRing_class.valuation",
  "sage.rings.rational_field:RationalField.valuation",
]
catalogue = []
tests = [
  "The valuation axioms on run-time rationals, with equality v(a + b) = min(v(a), v(b)) when v(a) != v(b)",
  "v(p) = 1; reduce is a ring homomorphism on the valuation ring with kernel {v > 0}; lift is a section of reduce",
  "The product formula with the real absolute value: |q| times the product of p^(-v_p(q)) is 1",
]
reuse = { status = "adaptable", components = ["mathlib.int.padic-valuation", "mathlib.zmod.arithmetic"], evidence = "Mathlib has `padicValRat` with the valuation axioms proved; the audit of Mathlib master reports the evaluation is noncomputable, so the executable object wraps `integers.valuation`." }
backends = []
references = ["Neu1999", "Mac1936"]

[[capability]]
id = "rings.random-sampling"
title = "Random elements of Z and Q"
statement = "Given a generator state, return a random integer: uniform on an interval [a, b), or from the distribution on Z with probability proportional to 1/max(1, |n|)^2 scaled by a size parameter. Return a random rational with numerator and denominator bounded by given bounds."
domain = "Z and Q with a named distribution; the general statement is a sampler on a set with a stated distribution."
contract = "generator state x parameters -> element x generator state. The distribution is part of the contract."
exactness = "exact"
exactness_notes = "The sample is an exact element. The claim under test is the distribution."
algorithms = [
  { family = "Uniform integers by rejection from random bits; inverse transform for the 1/n^2 law", sources = ["[Knu1997] section 3.4.1"] },
]
depends_on = ["integers.arithmetic", "rationals.arithmetic"]
sage = [
  "sage.rings.integer_ring:IntegerRing_class.random_element",
  "sage.rings.rational_field:RationalField.random_element",
]
catalogue = []
tests = [
  "Every sample lies in the requested interval or within the requested bounds",
  "Chi-squared test of uniformity on a small interval with a fixed seed sequence",
  "The same seed gives the same sequence",
]
reuse = { status = "adaptable", components = ["lean-core.int.bignum-arithmetic"], evidence = "Lean core has `StdGen` and `randNat`; Plausible has samplers for `Int` and `Rat`. The 1/n^2 law is specific to Sage and is a short program." }
backends = ["gmp"]
references = ["Knu1997"]

[[capability]]
id = "reals.elementary-functions"
title = "Elementary and gamma function values at integers and rationals"
statement = "Given a rational q and a precision, return an enclosure or a correctly rounded value of exp(q), of log(q) for q > 0 to a base b, and of Gamma(q) for q not a non-positive integer. Return the exact value when it is rational: log_b(b^k) = k, and Gamma(n) = (n - 1)! for integers n >= 1."
domain = "Q for the argument; real numbers to a finite precision for the value."
contract = "Q x precision -> real interval or floating-point number with a stated error bound; the exact cases return an integer or a rational."
exactness = "approximate"
exactness_notes = "Exact in the rational cases. Otherwise the value is a real number to the requested precision, and Sage returns a symbolic expression when no precision is given."
algorithms = [
  { family = "Argument reduction and binary splitting of Taylor series; arithmetic-geometric mean for the logarithm", sources = ["[BZ2010] chapter 4"] },
  { family = "Gamma function by the Stirling series and the functional equation", sources = ["[BZ2010] chapter 4", "[Joh2014]"] },
]
depends_on = ["rationals.arithmetic", "integers.integer-logarithm", "combinatorics.factorial"]
sage = [
  "sage.rings.integer:Integer.log",
  "sage.rings.integer:Integer.exp",
  "sage.rings.integer:Integer.gamma",
  "sage.rings.rational:Rational.log",
  "sage.rings.rational:Rational.gamma",
]
catalogue = ["mor.sets.real_exp"]
tests = [
  "exp(log(q)) encloses q; log(a b) and log(a) + log(b) have intersecting enclosures",
  "Gamma(n) = (n - 1)! exactly; Gamma(1/2)^2 encloses pi",
  "log_b(b^k) = k exactly for run-time b and k",
]
reuse = { status = "adaptable", components = ["leancert.expr-eval-dyadic", "leancert.rat-interval", "leancert.dyadic-interval"], evidence = "LeanCert evaluates exp and log on dyadic and rational intervals with certified enclosures. A gamma function enclosure is not listed." }
backends = ["mpfr", "pari", "arb"]
references = ["BZ2010", "Joh2014"]

