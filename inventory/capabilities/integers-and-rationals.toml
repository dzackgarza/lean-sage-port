# Manual section `rings_standard` (Integers and Rational Numbers).
#
# An operation is recorded at its natural generality (`euclidean.gcd`, `monoids.power`,
# `rings.quotient-ring`). The selectors of this file name only the integer and rational entities.
# Records for later sections extend those selectors or add a specialization under `generalizes`.

domain = "integers-and-rationals"

# ---------------------------------------------------------------------------------------------
# Ring arithmetic
# ---------------------------------------------------------------------------------------------

[[capability]]
id = "integers.arithmetic"
title = "Arithmetic of arbitrary-precision integers"
statement = "The ring operations of Z on integers of any size: sum, difference, product, negation, comparison, sign, parity, the unit test with the inverse of a unit, and the canonical associate |n|."
domain = "The ring Z."
contract = "Z x Z -> Z for +, -, *; Z -> {-1, 0, 1} for the sign; Z -> Bool for parity, unit and identity tests; a unit u maps to u^-1; n maps to |n|. The additive order of n is 1 for n = 0 and infinite otherwise; the multiplicative order is 1 for 1, 2 for -1 and infinite otherwise."
exactness = "exact"
algorithms = [
  { family = "Schoolbook, Karatsuba, Toom-Cook and FFT multiplication", sources = ["[Knu1997] section 4.3", "[BZ2010] chapter 1"] },
]
depends_on = []
sage = [
  "sage.rings.integer:Integer",
  "sage.rings.integer:Integer.list",
  "sage.rings.integer:Integer.sign",
  "sage.rings.integer:Integer.numerator",
  "sage.rings.integer:Integer.denominator",
  "sage.rings.integer:Integer.as_integer_ratio",
  "sage.rings.integer:Integer.real",
  "sage.rings.integer:Integer.imag",
  "sage.rings.integer:Integer.conjugate",
  "sage.rings.integer:Integer.is_one",
  "sage.rings.integer:Integer.is_integral",
  "sage.rings.integer:Integer.is_rational",
  "sage.rings.integer:Integer.is_integer",
  "sage.rings.integer:Integer.is_unit",
  "sage.rings.integer:Integer.is_even",
  "sage.rings.integer:Integer.is_odd",
  "sage.rings.integer:Integer.additive_order",
  "sage.rings.integer:Integer.multiplicative_order",
  "sage.rings.integer:Integer.inverse_of_unit",
  "sage.rings.integer:Integer.canonical_associate",
]
catalogue = ["obj.rings.integers", "obj.commutative_rings.integers", "op.rings.add", "op.rings.mul", "op.rings.neg"]
tests = [
  "Ring identities on run-time inputs, for example (a + b)^2 = a^2 + 2ab + b^2 and (a - b)(a + b) = a^2 - b^2",
  "Agreement of a result modulo several primes with the same computation in Z/p",
  "Agreement of a product with digit-list long multiplication, [Knu1997] section 4.3.1 Algorithm M",
]
reuse = { status = "reusable", components = ["lean-core.int.bignum-arithmetic"], evidence = "Lean's `Int` and `Nat` are arbitrary-precision and compile to GMP calls." }
backends = ["gmp"]
references = ["Knu1997", "BZ2010"]

[[capability]]
id = "rationals.arithmetic"
title = "Arithmetic of rational numbers"
statement = "The field operations of Q on fractions in lowest terms with positive denominator: sum, difference, product, quotient, comparison, sign, numerator and denominator, and the remainder of a rational with denominator prime to n modulo n."
domain = "The field Q."
contract = "Q x Q -> Q for +, -, *; Q x Q^* -> Q for /; Q -> Z x Z_{>0} for (numerator, denominator) with gcd 1; Q -> {-1, 0, 1} for the sign. The additive order of q is 1 for q = 0 and infinite otherwise; the multiplicative order is 1 for 1, 2 for -1 and infinite otherwise."
exactness = "exact"
algorithms = [
  { family = "Fraction arithmetic with gcd normalization", sources = ["[Knu1997] section 4.5.1"] },
]
depends_on = ["integers.arithmetic", "euclidean.gcd", "integers.modular-inverse"]
sage = [
  "sage.rings.rational:Rational",
  "sage.rings.rational:Rational.list",
  "sage.rings.rational:Rational.sign",
  "sage.rings.rational:Rational.numerator",
  "sage.rings.rational:Rational.denominator",
  "sage.rings.rational:Rational.as_integer_ratio",
  "sage.rings.rational:Rational.real",
  "sage.rings.rational:Rational.imag",
  "sage.rings.rational:Rational.conjugate",
  "sage.rings.rational:Rational.is_one",
  "sage.rings.rational:Rational.is_integral",
  "sage.rings.rational:Rational.is_rational",
  "sage.rings.rational:Rational.additive_order",
  "sage.rings.rational:Rational.multiplicative_order",
  "sage.rings.rational:Rational.mod_ui",
  "sage.rings.rational_field:frac",
]
catalogue = ["obj.rings.rationals", "obj.fields.rationals", "op.rings.add", "op.rings.mul", "op.rings.neg", "mor.sets.divide"]
tests = [
  "Field identities on run-time inputs, for example (a/b) + (c/d) = (ad + bc)/(bd) after reduction",
  "The result is in lowest terms: gcd(numerator, denominator) = 1 and denominator > 0",
  "Agreement with the image in Z/p for primes p that do not divide the denominators",
]
reuse = { status = "reusable", components = ["lean-core.rat.arithmetic"], evidence = "Lean's `Rat` stores a reduced fraction with a proof of coprimality and has compiled field operations." }
backends = ["gmp"]
references = ["Knu1997"]

[[capability]]
id = "monoids.power"
title = "Power of an element of a monoid by an integer exponent"
statement = "Given x in a monoid M and n >= 0, return x^n with O(log n) multiplications. For x invertible and n < 0, return (x^-1)^|n|."
domain = "Multiplicative monoids; groups for negative exponents."
contract = "M x N -> M, and G x Z -> G for a group G. The result is independent of the addition chain."
exactness = "exact"
algorithms = [
  { family = "Binary powering (square and multiply), left-to-right and right-to-left", sources = ["[Knu1997] section 4.6.3", "[Coh1993] section 1.2"] },
]
depends_on = []
sage = ["sage.arith.power:generic_power"]
catalogue = ["mor.sets.monoid_power", "op.rings.pow", "op.semirings.pow"]
tests = [
  "x^(m + n) = x^m x^n and (x^m)^n = x^(mn) on run-time inputs",
  "Agreement with the product of n copies of x for small n, in Z, in Z/m and in 2 x 2 integer matrices",
]
reuse = { status = "reusable", components = ["lean-core.int.bignum-arithmetic"], evidence = "`Nat.pow` and `Int.pow` compile to GMP calls. Mathlib has `npowBinRec`, binary powering in any monoid; the default `Monoid.npow` field is the linear `npowRec`." }
backends = []
references = ["Knu1997", "Coh1993"]

# ---------------------------------------------------------------------------------------------
# Euclidean structure
# ---------------------------------------------------------------------------------------------

[[capability]]
id = "euclidean.division"
title = "Division with remainder in a Euclidean domain"
statement = "Given a and b != 0 in a Euclidean domain R with degree function d, return q and r with a = q b + r and r = 0 or d(r) < d(b). Decide whether b divides a, and return the exact quotient when it does."
domain = "Euclidean domains with a computable division. For Z, d(n) = |n| and the remainder convention is stated by the operation (floor, truncation or balanced)."
contract = "R x (R - 0) -> R x R for (q, r); R x R -> Bool for divisibility; exact division is defined when b divides a."
exactness = "exact"
algorithms = [
  { family = "Long division; Newton reciprocal division; exact division from the low digits", sources = ["[Knu1997] section 4.3.1 Algorithm D", "[BZ2010] sections 1.4 and 1.4.5"] },
]
depends_on = ["integers.arithmetic"]
sage = [
  "sage.rings.integer:Integer.quo_rem",
  "sage.rings.integer:Integer.euclidean_degree",
  "sage.rings.integer:Integer.divides",
  "sage.rings.integer:Integer.divide_knowing_divisible_by",
  "sage.rings.integer_ring:IntegerRing_class.parameter",
]
catalogue = []
tests = [
  "a = q b + r and |r| < |b| on run-time inputs; for Sage Integer.quo_rem, nonzero r has the sign of b, including negative b",
  "b divides a if and only if the remainder is 0; exact division returns q with q b = a",
]
reuse = { status = "adaptable", components = ["mathlib.euclidean.generic-algorithms", "lean-core.int.bignum-arithmetic", "hex.HexArith.int-exact-div", "hex.HexPoly.div-mod"], evidence = "Mathlib's EuclideanDomain class supplies generic quotient/remainder and Hex supplies field-polynomial divMod. Lean core Int.ediv/emod/fdiv/tdiv are compiled; choose the quotient/remainder convention explicitly for Sage Integer.quo_rem. Hex supplies exact integer division when divisibility is known." }
backends = ["gmp"]
references = ["Knu1997", "BZ2010"]

[[capability]]
id = "euclidean.gcd"
title = "Greatest common divisor and least common multiple in a Euclidean domain"
statement = "Given a, b in a Euclidean domain R, return the normalized generator g of the ideal (a, b) and the normalized generator l of the ideal (a) intersected with (b). Extend both to finite lists. For a rational q, the content is |q|."
domain = "Euclidean domains with a computable division and a unit-normal form. For Z the normal form is the non-negative associate."
contract = "R x R -> R for gcd and lcm; List R -> R with gcd [] = 0 and lcm [] = 1. For rationals a/b and c/d in lowest terms: gcd = gcd(a, c)/lcm(b, d) and lcm = lcm(a, c)/gcd(b, d)."
exactness = "exact"
algorithms = [
  { family = "Euclidean algorithm; binary gcd; Lehmer's algorithm; half-gcd", sources = ["[Knu1997] section 4.5.2", "[Coh1993] section 1.3", "[BZ2010] section 1.6"] },
]
depends_on = ["euclidean.division"]
sage = [
  "sage.arith.misc:gcd",
  "sage.arith.functions:lcm",
  "sage.arith.functions:LCM_list",
  "sage.rings.integer:GCD_list",
  "sage.rings.rational:Rational.content",
]
catalogue = ["mor.sets.gcd"]
tests = [
  "g divides a and b, and every common divisor of a and b divides g",
  "gcd(a, b) lcm(a, b) = |a b| in Z",
  "Agreement with the gcd read from the prime factorizations of a and b",
]
reuse = { status = "adaptable", components = ["mathlib.euclidean.generic-algorithms", "lean-core.int.gcd-lcm", "hex.HexPoly.gcd-xgcd"], evidence = "Mathlib EuclideanDomain.gcd is generic but returns a non-unique associate; the selected unit normalization remains required. Nat/Int gcd and lcm are compiled; Hex DensePoly supplies field-polynomial gcd/lcm and monicization. The source's list and rational conventions need explicit selection." }
backends = ["gmp", "pari"]
references = ["Knu1997", "Coh1993", "BZ2010"]

[[capability]]
id = "euclidean.xgcd"
title = "Extended greatest common divisor"
statement = "Given a, b in a Euclidean domain R, return g, s, t with g = gcd(a, b) = s a + t b."
domain = "Euclidean domains with a computable division and a unit-normal form."
contract = "R x R -> R x R x R, (a,b) -> (g,s,t) with g = s*a + t*b and g the normalized gcd under the selected unit convention. The integer and generic Sage xgcd sources do not guarantee minimal cofactors. The arith.misc list form returns (g,s_1,...,s_n) with g = sum s_i*a_i; its empty input returns (0,) and singleton input (a,1)."
exactness = "exact"
algorithms = [
  { family = "Extended Euclidean algorithm; Lehmer's extension; half-gcd", sources = ["[Knu1997] section 4.5.2 Algorithm X", "[Coh1993] section 1.3"] },
]
depends_on = ["euclidean.division"]
sage = [
  "sage.arith.misc:xgcd",
  "sage.rings.integer:Integer.xgcd",
]
catalogue = []
tests = [
  "The Bezout identity g = s a + t b, with g equal to the result of `euclidean.gcd`",
  "Sage source doctests for arith.misc:xgcd list inputs, including empty and singleton cases; compare the Bezout identity and the source's normalization convention",
]
reuse = { status = "adaptable", components = ["mathlib.euclidean.generic-algorithms", "mathlib.int.xgcd", "hex.HexArith.extended-gcd", "hex.HexPoly.gcd-xgcd"], evidence = "Mathlib EuclideanDomain.xgcd gives generic Bezout coefficients from a computable EuclideanDomain instance but does not itself select a normalized gcd. Mathlib's Nat.xgcd and Int.gcdA/gcdB, Hex integer extended gcd, and Hex DensePoly xgcd are executable for their stated domains. Source list behavior and unit normalization remain to be composed." }
backends = ["gmp"]
references = ["Knu1997", "Coh1993"]

[[capability]]
id = "rationals.rounding"
title = "Rounding of rational numbers to integers"
statement = "Given a rational q, return the floor, the ceiling, the truncation toward 0, and the nearest integer under a stated tie rule (away from 0, toward 0, to even, up or down)."
domain = "Q; real numbers given exactly enough to decide the comparison."
contract = "Q -> Z. floor(q) <= q < floor(q) + 1; ceil(q) = -floor(-q); trunc(q) = sign(q) floor(|q|)."
exactness = "exact"
algorithms = [
  { family = "Division with remainder of the numerator by the denominator", sources = ["[GKP1994] chapter 3"] },
]
depends_on = ["euclidean.division", "rationals.arithmetic"]
sage = [
  "sage.rings.rational:Rational.floor",
  "sage.rings.rational:Rational.ceil",
  "sage.rings.rational:Rational.trunc",
  "sage.rings.rational:Rational.round",
  "sage.rings.integer:Integer.floor",
  "sage.rings.integer:Integer.ceil",
  "sage.rings.integer:Integer.trunc",
  "sage.rings.integer:Integer.round",
  "sage.arith.misc:integer_floor",
  "sage.arith.misc:integer_ceil",
  "sage.arith.misc:integer_trunc",
]
catalogue = []
tests = [
  "The defining inequalities floor(q) <= q < floor(q) + 1 and ceil(q) - 1 < q <= ceil(q)",
  "floor(q + n) = floor(q) + n for integers n; each tie rule on half-integers, [GKP1994] chapter 3",
]
reuse = { status = "reusable", components = ["mathlib.rat.floor-sqrt"], evidence = "`Rat.floor`, `Rat.ceil` and Mathlib's `FloorRing Rat` instance are compiled." }
backends = ["gmp"]
references = ["GKP1994"]

# ---------------------------------------------------------------------------------------------
# Modular arithmetic
# ---------------------------------------------------------------------------------------------

[[capability]]
id = "integers.modular-inverse"
title = "Inverse of an integer modulo an integer"
statement = "Given a and m > 0 with gcd(a, m) = 1, return the b in [0, m) with a b = 1 mod m. Report that no inverse exists when gcd(a, m) != 1."
domain = "Z and a modulus m > 0; more generally a Euclidean domain and an ideal generator."
contract = "Z x Z_{>0} -> Z, defined exactly when gcd(a, m) = 1."
exactness = "exact"
algorithms = [
  { family = "Extended Euclidean algorithm", sources = ["[Knu1997] section 4.5.2", "[Coh1993] section 1.3"] },
]
depends_on = ["euclidean.xgcd"]
sage = [
  "sage.arith.misc:inverse_mod",
  "sage.rings.integer:Integer.inverse_mod",
]
catalogue = []
tests = [
  "a b = 1 mod m and 0 <= b < m",
  "For a prime modulus p, agreement with a^(p - 2) mod p (Fermat's little theorem)",
]
reuse = { status = "reusable", components = ["mathlib.zmod.arithmetic", "hex.HexArith.extended-gcd"], evidence = "`ZMod.inv` is defined through `Nat.gcdA` and is compiled." }
backends = ["gmp"]
references = ["Knu1997", "Coh1993"]

[[capability]]
id = "integers.modular-power"
title = "Power of an integer modulo an integer"
statement = "Given a, an exponent n and a modulus m > 0, return a^n mod m without forming a^n. For n < 0 and gcd(a, m) = 1, return (a^-1)^|n| mod m."
domain = "Z, an exponent in Z and a modulus m > 0."
contract = "Z x Z x Z_{>0} -> [0, m)."
exactness = "exact"
algorithms = [
  { family = "Binary and sliding-window powering with Montgomery or Barrett reduction", sources = ["[Coh1993] section 1.2", "[BZ2010] sections 2.4 and 2.6"] },
]
depends_on = ["monoids.power", "integers.modular-inverse"]
sage = [
  "sage.arith.misc:power_mod",
  "sage.rings.integer:Integer.powermod",
]
catalogue = []
tests = [
  "Agreement with (a^n) mod m computed in Z for small n",
  "Euler's theorem a^phi(m) = 1 mod m for gcd(a, m) = 1",
]
reuse = { status = "reusable", components = ["lean-core.int.modpow", "hex.HexArith.pow-mod", "hex.HexArith.montgomery", "hex.HexArith.barrett"], evidence = "`Nat.powMod` in Lean core and Hex's `powMod` with Montgomery and Barrett contexts are compiled." }
backends = ["gmp"]
references = ["Coh1993", "BZ2010"]

[[capability]]
id = "modular.crt"
title = "Chinese remainder reconstruction"
statement = "Given residues a_i and moduli m_i, return x with x = a_i mod m_i for all i, modulo lcm(m_i), or report that the system is inconsistent. Return the basis e_i with e_i = 1 mod m_i and e_i = 0 mod m_j for j != i when the moduli are pairwise coprime. Apply the reconstruction entry by entry to vectors."
domain = "Z; more generally a Euclidean domain. Moduli need not be coprime for two residues: the system is consistent exactly when a_1 = a_2 mod gcd(m_1, m_2)."
contract = "List (R x R) -> R x R for (x, lcm of the moduli), with x reduced modulo the lcm; List R -> List R for the basis."
exactness = "exact"
algorithms = [
  { family = "Pairwise extended gcd; Garner's mixed-radix algorithm; product and remainder trees", sources = ["[Knu1997] section 4.3.2", "[Coh1993] section 1.3.3", "[GG2013] sections 5.4 and 10.3"] },
]
depends_on = ["euclidean.xgcd"]
sage = [
  "sage.arith.misc:crt",
  "sage.arith.misc:CRT_list",
  "sage.arith.misc:CRT_basis",
  "sage.arith.misc:CRT_vectors",
  "sage.rings.integer:Integer.crt",
  "sage.rings.integer_ring:crt_basis",
]
catalogue = []
tests = [
  "x = a_i mod m_i for every i and 0 <= x < lcm(m_i)",
  "Round trip: for a run-time x below the product of the moduli, the reconstruction of its residues is x",
  "Inconsistent systems (a_1 != a_2 mod gcd(m_1, m_2)) are rejected",
]
reuse = { status = "reusable", components = ["hex.HexModular.crt", "mathlib.int.crt"], evidence = "Hex has incremental and vector Chinese remaindering with product-tree plans; Mathlib's `Nat.chineseRemainder` is computable." }
backends = ["gmp"]
references = ["Knu1997", "Coh1993", "GG2013"]

[[capability]]
id = "modular.multimodular-basis"
title = "Multimodular residue bases"
statement = "Keep a list of pairwise coprime word-sized primes with the precomputed partial products and inverses of Garner's algorithm. Extend the list until its product exceeds a bound, replace a prime, and reconstruct an integer from its residues."
domain = "Lists of distinct primes below the machine word bound."
contract = "A basis (p_1, ..., p_k) with partial products P_i = p_1 ... p_i and c_i = P_{i-1}^-1 mod p_i; residues (r_1, ..., r_k) -> the x in [0, P_k) with x = r_i mod p_i."
exactness = "exact"
algorithms = [
  { family = "Garner's mixed-radix reconstruction with a growing prime list", sources = ["[Knu1997] section 4.3.2", "[GG2013] section 5.4"] },
]
depends_on = ["modular.crt", "integers.prime-search"]
sage = ["sage.arith.multi_modular:*"]
catalogue = []
tests = [
  "Round trip for a run-time integer below the product of the basis",
  "After an extension to a height bound H the product of the basis exceeds H",
]
reuse = { status = "reusable", components = ["hex.HexModular.crt", "hex.HexModArith.prime-field"], evidence = "Hex's CRT plans keep product trees over a prime list; `HexModArith` enumerates word-sized primes." }
backends = ["gmp"]
references = ["Knu1997", "GG2013"]

[[capability]]
id = "modular.rational-reconstruction"
title = "Rational reconstruction from a residue"
statement = "Given a and m > 0, return the rational n/d with n = a d mod m, gcd(d, m) = 1 and |n|, d <= sqrt(m/2), which is unique when it exists; report that none exists otherwise. The maximal-quotient variant returns n/d with the smallest |n| d below a threshold."
domain = "Z and a modulus m > 0; vectors entry by entry with a common denominator."
contract = "Z x Z_{>0} -> Q, partial. With bounds N, D satisfying 2 N D < m the answer with |n| <= N and 0 < d <= D is unique."
exactness = "exact"
algorithms = [
  { family = "Truncated extended Euclidean algorithm (Wang)", sources = ["[Wan1981]", "[GG2013] section 5.10"] },
  { family = "Maximal quotient rational reconstruction", sources = ["[Mon2004]"] },
]
depends_on = ["euclidean.xgcd"]
sage = [
  "sage.arith.misc:rational_reconstruction",
  "sage.arith.misc:mqrr_rational_reconstruction",
  "sage.rings.integer:Integer.rational_reconstruction",
]
catalogue = []
tests = [
  "n = a d mod m and the bounds on |n| and d",
  "Round trip: for a run-time n/d with 2 |n| d < m, the reconstruction of n d^-1 mod m is n/d",
]
reuse = { status = "reusable", components = ["hex.HexModular.rational-reconstruction"], evidence = "Hex has scalar and vector rational reconstruction from a modular image." }
backends = ["gmp"]
references = ["Wan1981", "Mon2004", "GG2013"]

[[capability]]
id = "modular.primitive-root"
title = "Primitive root modulo an integer"
statement = "Given n = 1, 2, 4, p^k or 2 p^k for an odd prime p, return the smallest positive generator of the cyclic group (Z/n)^*. Report that none exists for other n."
domain = "Positive integers n."
contract = "Z_{>0} -> Z, defined exactly when (Z/n)^* is cyclic."
exactness = "exact"
algorithms = [
  { family = "Search over candidates g with g^(phi/q) != 1 for each prime q dividing phi(n); lift from p to p^k", sources = ["[Coh1993] section 1.4.1"] },
]
depends_on = ["integers.factorization", "integers.modular-power", "integers.multiplicative-functions"]
sage = ["sage.arith.misc:primitive_root"]
catalogue = []
tests = [
  "The multiplicative order of g modulo n is phi(n)",
  "No smaller positive integer has order phi(n)",
  "Existence exactly for n = 1, 2, 4, p^k, 2 p^k (Gauss)",
]
reuse = { status = "adaptable", components = ["hex.HexIntFactor.multiplicative-order"], evidence = "Hex has multiplicative-order certificates and primitive roots from a checked factorization; the lift to prime powers and the smallest-root contract need a wrapper." }
backends = ["pari"]
references = ["Coh1993"]

[[capability]]
id = "modular.residue-sets"
title = "Sets of residues with a multiplicative property"
statement = "Given n > 0, list the quadratic residues modulo n, and list the integers in [1, m] that are coprime to n."
domain = "Positive integers n, and a bound m."
contract = "Z_{>0} -> sorted List Z for the squares modulo n in [0, n); Z x Z_{>0} -> sorted List Z for the integers 1 <= k <= m with gcd(k, n) = 1."
exactness = "exact"
algorithms = [
  { family = "Enumeration of squares; sieve by the prime divisors of n", sources = ["[HW2008] chapter VI"] },
]
depends_on = ["euclidean.gcd", "integers.factorization"]
sage = [
  "sage.arith.misc:quadratic_residues",
  "sage.rings.integer:Integer.coprime_integers",
]
catalogue = []
tests = [
  "For an odd prime p there are (p + 1)/2 quadratic residues in [0, p), and r != 0 is one exactly when the Legendre symbol (r/p) is 1",
  "The number of integers in [1, n] coprime to n is phi(n)",
]
reuse = { status = "adaptable", components = ["mathlib.zmod.units", "lean-core.int.gcd-lcm"], evidence = "Both sets are finite filters over compiled gcd and multiplication; no declaration returns them in this form." }
backends = []
references = ["HW2008"]

# ---------------------------------------------------------------------------------------------
# Representation, roots, logarithms, valuations
# ---------------------------------------------------------------------------------------------

[[capability]]
id = "integers.radix-representation"
title = "Positional representation of integers and rationals"
statement = "Given an integer n and a base b >= 2, return the digits of n in base b, least significant first, and the string in bases 2 to 36. Return the balanced digits in (-b/2, b/2]. Return the number of digits, the bit length, the number of trailing zero bits, single bits and the number of 1 bits. Convert between an integer and a byte string in big-endian or little-endian order, signed or unsigned. Convert a rational to the string of its numerator and denominator."
domain = "Z and Q; bases b >= 2; two's complement for the bit operations on negative integers where the operation states it."
contract = "Z x Z_{>=2} -> List Z with n = sum d_i b^i and 0 <= d_i < b (digits of |n| for n < 0, with the sign applied to each digit); Z -> String and String -> Z are inverse to each other; Z -> Bytes and Bytes -> Z are inverse to each other for a given length, byte order and signedness."
exactness = "exact"
algorithms = [
  { family = "Repeated division for small inputs; divide-and-conquer radix conversion", sources = ["[Knu1997] section 4.4", "[BZ2010] section 1.7"] },
]
depends_on = ["euclidean.division"]
sage = [
  "sage.rings.integer:Integer.str",
  "sage.rings.integer:Integer.hex",
  "sage.rings.integer:Integer.oct",
  "sage.rings.integer:Integer.binary",
  "sage.rings.integer:Integer.bits",
  "sage.rings.integer:Integer.bit_length",
  "sage.rings.integer:Integer.nbits",
