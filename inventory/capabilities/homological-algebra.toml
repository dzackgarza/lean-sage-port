catalogue = []
tests = ["The evaluation identity <d^dual phi,x>=<phi,dx> holds for runtime vectors and covectors.", "Double dualization recovers every differential matrix under the evaluation identification.", "Dualizing a composite chain map reverses its order; source and target are interchanged."]
