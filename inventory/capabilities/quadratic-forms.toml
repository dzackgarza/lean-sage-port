domain = "quadratic_forms"

[[capability]]
id = "quadratic-forms.arithmetic-and-genera"
title = "Binary, ternary and general quadratic forms"
statement = "Construct quadratic forms and compute evaluation, equivalence, reduction, local solvability, genera, class groups, representations and special values."
domain = "A symmetric Gram matrix or form coefficients over integers, rationals or a supported local ring."
