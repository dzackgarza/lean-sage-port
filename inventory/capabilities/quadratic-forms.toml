exactness = "conditional"
exactness_notes = "Exact over exact coefficient domains; local and class-group algorithms require their documented arithmetic hypotheses."
algorithms = [{ family = "Quadratic-form arithmetic, reduction and genera", sources = ["sage.quadratic_forms.*:*"] }]
depends_on = ["matrices.core-and-backends", "modules.filtered-graded-and-quadratic"]
sage = ["sage.quadratic_forms.*:*"]
catalogue = []
tests = ["Form evaluation and basis-change invariance.", "Reduction/equivalence and discriminant checks.", "Local solvability, genus and class-group identities.", "Representation counts on published examples."]
reuse = { status = "adaptable", components = ["mathlib.linalg.matrix-arithmetic", "mathlib.int.factorization"], evidence = "Matrix and arithmetic foundations are reusable; Sage's reduction, genus, local-symbol and class-group algorithms require native implementations." }
