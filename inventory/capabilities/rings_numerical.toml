  "sage.rings.complex_arb:*",
  "sage.rings.complex_interval:*",
  "sage.rings.complex_interval_field:*",
]
catalogue = []
tests = [
  "Sage doctests for complex balls.",
  "Every computed enclosure contains the exact result of the corresponding complex operation on sample inputs.",
