id = "cryptography.sboxes-and-boolean-functions"
title = "S-boxes and Boolean functions"
statement = "Construct an S-box or Boolean function from a truth table, and compute its algebraic normal form, Walsh spectrum, nonlinearity, differential uniformity, linearity and algebraic degree."
domain = "A truth table over GF(2)^n, or a named S-box."
contract = "(S) -> the S-box with its truth table, inverse where bijective, algebraic normal form, Walsh and autocorrelation spectra, nonlinearity, differential uniformity, algebraic degree and (for Boolean functions) its truth-table properties and the Reed-Muller transform."
exactness = "exact"
algorithms = [{ family = "Walsh transform and cryptographic criteria", sources = ["sage.crypto.boolean_function:*", "sage.crypto.sbox:*", "sage.crypto.sboxes:*"] }]
depends_on = []
