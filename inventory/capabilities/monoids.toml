domain = "monoids"

[[capability]]
id = "monoids.free-and-indexed"
title = "Free and indexed free monoids"
statement = "Construct free noncommutative, free commutative, and indexed monoids with named generators, word/exponent representations, multiplication, powers and canonical coercions."
domain = "A finite generator set or an index set, with an optional commutativity flag and generator names."
contract = "I -> M with identity, generators, exact word or finitely supported exponent elements, associative multiplication, powers, equality and generator-indexed families."
exactness = "exact"
algorithms = [
  { family = "Free-word multiplication and normalization", sources = ["sage.monoids.free_monoid:FreeMonoid", "sage.monoids.free_monoid_element:FreeMonoidElement", "sage.monoids.indexed_free_monoid:IndexedFreeMonoid", "sage.monoids.indexed_free_monoid:IndexedMonoidElement"] },
  { family = "Finitely supported exponent-vector multiplication", sources = ["sage.monoids.free_abelian_monoid:FreeAbelianMonoid", "sage.monoids.free_abelian_monoid_element:FreeAbelianMonoidElement"] },
]
depends_on = []
sage = [
  "sage.monoids.free_monoid:*",
  "sage.monoids.free_monoid_element:*",
  "sage.monoids.free_abelian_monoid:*",
  "sage.monoids.free_abelian_monoid_element:*",
  "sage.monoids.indexed_free_monoid:*",
  "sage.monoids.monoid:*",
]
catalogue = ["cat.monoids"]
tests = [
  "Sage doctests for named and indexed free monoids, word multiplication, abelian exponent normalization, identity, powers and equality.",
  "Independent word/exponent oracle: compare multiplication with concatenation for free monoids and pointwise exponent addition for free abelian monoids.",
]
reuse = { status = "adaptable", components = ["catalogue.cat.monoids"], evidence = "The catalogue supplies monoid carriers and laws; executable free-word, indexed and exponent-vector representations require native implementations." }
backends = []
references = []

[[capability]]
id = "monoids.string-words"
title = "Finite alphabet string monoids"
statement = "Construct free monoids specialized to binary, hexadecimal and other finite string alphabets, with encoding, decoding and string-element operations."
domain = "A finite alphabet and strings or generator-index lists over it."
contract = "A -> free monoid on A with exact alphabet membership, identity empty string, generator access, concatenation, powers, parsing and documented byte/string encodings."
exactness = "exact"
algorithms = [{ family = "Alphabet-indexed word representation and encodings", sources = ["sage.monoids.string_monoid:StringMonoid_class", "sage.monoids.string_monoid_element:StringMonoidElement", "sage.monoids.string_ops:strip_encoding"] }]
depends_on = ["monoids.free-and-indexed"]
sage = ["sage.monoids.string_monoid:*", "sage.monoids.string_monoid_element:*", "sage.monoids.string_ops:*"]
catalogue = ["cat.monoids"]
tests = [
  "Sage doctests for binary and hexadecimal strings, generator bounds, identity, multiplication, encodings and strip_encoding.",
  "Independent string oracle: compare word values with Python string concatenation and alphabet validation.",
]
reuse = { status = "adaptable", components = ["catalogue.cat.monoids"], evidence = "The free monoid carrier is reusable; alphabet-specific parsing, encoding and string statistics require native adapters." }
backends = []
references = []

[[capability]]
id = "monoids.automatic-semigroup-closure"
title = "Finitely generated automatic semigroup closure"
statement = "Enumerate the subsemigroup or submonoid generated by ambient elements, construct right Cayley transitions and retain reduced-word representatives."
domain = "An ambient semigroup/monoid, finite generator family and optional multiplication/identity representation policy."
contract = "G -> S with closure under multiplication, exact finite cardinality when closure terminates, lazy construction, reduced words, lifting/retraction, idempotents, Green-style classes and Cayley graph transitions."
exactness = "exact"
algorithms = [{ family = "Length-lexicographic automaton closure", sources = ["sage.monoids.automatic_semigroup:AutomaticSemigroup"] }]
depends_on = ["sets.indexed-families"]
sage = ["sage.monoids.automatic_semigroup:*"]
catalogue = ["cat.monoids"]
tests = [
  "Sage doctests for finite modular and permutation-generated semigroups, reduced words, cardinality, idempotents and Cayley graphs.",
  "Independent closure oracle: repeatedly multiply the finite generator set until a fixed point and compare elements and reduced-word lengths.",
]
reuse = { status = "missing", components = [], evidence = "No surveyed reusable Lean component was identified for the executable automaton-backed semigroup closure and reduced-word policy." }
backends = []
references = []

[[capability]]
id = "monoids.word-quotients"
title = "Plactic and hypoplactic word monoids"
statement = "Construct plactic and hypoplactic quotient monoids of finite words, multiply by concatenation followed by canonical tableau representatives, and expose graded subsets."
domain = "A positive finite alphabet rank n and words over {1,...,n}."
contract = "W -> quotient monoid with identity, generators, exact word validation, canonical insertion tableau, reading-word representative, equivalence, multiplication and fixed-length graded subsets."
exactness = "exact"
algorithms = [
  { family = "RSK insertion and tableau canonicalization", sources = ["sage.monoids.plactic_monoid:PlacticMonoid", "sage.monoids.plactic_monoid:WordMonoidElement"] },
  { family = "Krob-Thibon quasi-ribbon insertion", sources = ["sage.monoids.hypoplactic_monoid:HypoplacticMonoid", "sage.monoids.hypoplactic_monoid:HypoplacticMonoid.Element"] },
]
depends_on = ["monoids.free-and-indexed"]
sage = ["sage.monoids.plactic_monoid:*", "sage.monoids.hypoplactic_monoid:*"]
catalogue = ["cat.monoids"]
tests = [
  "Sage doctests for tableau equality, canonical reading words, multiplication, identity, rank validation and graded subsets.",
  "Independent insertion oracle: compare quotient equality and products with RSK/quasi-ribbon insertion on generated words.",
]
reuse = { status = "missing", components = [], evidence = "The surveyed reuse inventory has no accepted executable plactic or hypoplactic implementation; tableau and quotient algorithms require a native or owner implementation." }
backends = []
references = ["[KT1997]", "[Nov2000]"]

[[capability]]
id = "monoids.trace"
title = "Trace monoids with partial commutation"
statement = "Construct free partially commutative monoids from an independence relation and compute canonical lexicographic and Foata normal forms."
domain = "A finite generator alphabet and a symmetric independence relation."
contract = "I -> trace monoid whose elements are equivalence classes of words under independent commutations, with associative product, canonical representatives, dependence/Hasse graphs and Foata normal form."
exactness = "exact"
algorithms = [{ family = "Dependence-graph trace normalization", sources = ["sage.monoids.trace_monoid:TraceMonoid", "sage.monoids.trace_monoid:TraceMonoidElement"] }]
depends_on = ["monoids.free-and-indexed"]
sage = ["sage.monoids.trace_monoid:*"]
catalogue = ["cat.monoids"]
tests = [
  "Sage doctests for independence-equivalent products, lexicographic and Foata normal forms, dependence graphs and Hasse diagrams.",
  "Independent trace oracle: normalize words by a terminating rewrite system and compare products and normal forms.",
]
reuse = { status = "missing", components = [], evidence = "No surveyed reusable Lean trace-monoid implementation was identified; dependence-graph normalization is an open native capability." }
backends = []
references = ["Wikipedia: Trace monoid", "nLab: trace monoid"]

[[capability]]
id = "monoids.hecke"
title = "Zero-Hecke monoid of a finite Coxeter group"
statement = "Construct the 0-Hecke monoid generated by idempotent simple projections satisfying the Coxeter braid and commutation relations."
domain = "A finite Coxeter group W with simple reflections and executable sorting projections."
contract = "W -> H with generators pi_i, pi_i^2=pi_i, Coxeter braid/commutation relations and cardinality equal to |W|, represented as a submonoid of finite maps."
exactness = "exact"
algorithms = [{ family = "Simple-projection submonoid of finite maps", sources = ["sage.monoids.hecke_monoid:HeckeMonoid"] }]
depends_on = ["sets.finite-function-spaces"]
sage = ["sage.monoids.hecke_monoid:*"]
catalogue = ["cat.monoids"]
tests = [
  "Sage doctests verify idempotence, braid and commutation relations and cardinality for symmetric groups.",
  "Independent Coxeter oracle: evaluate projection products on W and compare relation normal forms and generated cardinality.",
]
reuse = { status = "adaptable", components = ["catalogue.cat.monoids"], evidence = "The monoid carrier is available; finite-map representation and Coxeter projection generation depend on accepted group and finite-function capabilities." }
