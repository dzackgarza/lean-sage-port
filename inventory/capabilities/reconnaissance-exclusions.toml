# Explicit non-mathematical Sage entities excluded from native capability coverage.

domain = "reconnaissance-exclusions"

[[exclusion]]
id = "reconnaissance.groups.braid-plotting"
reason = "presentation"
rationale = "Braid plotting methods render braid diagrams; the underlying braid, closure and polynomial operations are covered separately as mathematical capabilities."
sage = [
  "sage.groups.braid:Braid.plot",
  "sage.groups.braid:Braid.plot3d",
]

[[exclusion]]
id = "reconnaissance.groups.cube-visualization"
reason = "presentation"
rationale = "These public Rubik-cube helpers render or format a state for visualization; they are not intrinsic group operations and therefore do not define native mathematical capability coverage."
