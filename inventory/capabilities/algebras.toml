  { family = "Contraction and Hodge dual through the volume form", sources = ["sage.algebras.clifford_algebra_element:ExteriorAlgebraElement.interior_product", "sage.algebras.clifford_algebra_element:ExteriorAlgebraElement.hodge_dual"] },
]
