[[capability]]
id = "algebras.exterior-algebra"
title = "Exterior algebra with wedge product, Hopf structure and contraction"
statement = "Construct the exterior algebra of a free module with the wedge product and its Z-grading, its Hopf superalgebra structure, the interior product, the Hodge dual, the lifted bilinear form, and the algebra morphisms induced by linear maps."
domain = "A free module V of rank n over a commutative ring R with a chosen ordered basis."
contract = "(V) -> Lambda(V) with basis indexed by the subsets of the basis in increasing order; the wedge product is signed concatenation, so e_i^2 = 0 and e_i e_j = -e_j e_i, and the degree of a basis element is its subset size. The construction retains the generators and the volume form e_1 ... e_n. Hopf structure: the counit is the constant coefficient, the coproduct is the signed unshuffle sum and is a superalgebra morphism, and the antipode is S(omega) = (-1)^(deg omega) omega. Further structure: the interior product i_alpha is the degree -1 graded derivation determined by i_alpha(v) = alpha(v); the Hodge dual is i_alpha applied to the volume form; the lifted bilinear form of a matrix M is Lambda(f)(v,w) = det f(v_i,w_j) for equal degrees and 0 otherwise; a linear map lifts to an algebra morphism. The right-angled Artin cohomology element class specializes the multiplication to the cup product on H*(A)."
exactness = "exact"
algorithms = [
  { family = "Ordered-subset normal form with signed shuffles", sources = ["sage.algebras.clifford_algebra:ExteriorAlgebra", "sage.algebras.clifford_algebra_element:ExteriorAlgebraElement"] },
