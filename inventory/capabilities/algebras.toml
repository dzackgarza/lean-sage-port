title = "Clifford algebra of a quadratic form"
statement = "Construct the Clifford algebra Cl(V,Q) = T(V) modulo the two-sided ideal generated by v tensor v - Q(v), with the ordered-subset normal form, its filtration and superstructure, its center and supercenter, and the algebra morphisms induced by linear maps and isometries."
domain = "A quadratic form Q on a free module V of finite rank n over a commutative ring R, together with a chosen basis and generator names."
contract = "(Q,names) -> Cl(V,Q) with basis indexed by the subsets of the n basis vectors in increasing order and dimension 2^n; the product satisfies e_i e_j + e_j e_i = 2 B(e_i,e_j) for the associated bilinear form, in particular e_i^2 = Q(e_i). The construction retains the quadratic form, the ambient free module, the generators, the unit pseudoscalar e_1 ... e_n and the subset filtration degree; the Z/2-grading is exposed through the super degree. Every linear map j : V -> A with j(v)^2 = Q(v) lifts uniquely to an algebra morphism, a linear map m : W -> V lifts to Cl(m) : Cl(W, m(Q)) -> Cl(V,Q), and an invertible isometry lifts to an isomorphism. The associated graded algebra is the exterior algebra of V. Center and supercenter bases are kernels of the commutator and supercommutator matrices, so the base ring must admit kernels."
