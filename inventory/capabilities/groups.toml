catalogue = ["cat.groups"]
tests = [
  "Argument normalization, product, powers and inverse agree modulo one.",
  "Roots-of-unity orders and sign identities are verified exactly.",
  "Imaginary addition/subtraction/negation and projections agree with the base ring.",
]
