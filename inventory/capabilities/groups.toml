title = "Finitely generated abelian groups and homomorphisms"
statement = "Construct finitely generated abelian groups as products of infinite and finite cyclic factors, with exponent-vector elements, invariants, subgroups and homomorphisms."
domain = "A finite list of cyclic orders, where zero denotes an infinite cyclic factor."
contract = "orders -> G with exact product decomposition, generators, element orders, elementary divisors, subgroup generation and compatible group homomorphisms."
exactness = "exact"
algorithms = [{ family = "Cyclic-factor abelian-group and generator-image algorithms", sources = ["sage.groups.abelian_gps.abelian_group:AbelianGroup", "sage.groups.abelian_gps.abelian_group_element:AbelianGroupElement", "sage.groups.abelian_gps.abelian_group_morphism:AbelianGroupMorphism"] }]
depends_on = ["groups.free-and-indexed"]
sage = [
  "sage.groups.abelian_gps.abelian_group:*",
  "sage.groups.abelian_gps.abelian_group_element:*",
  "sage.groups.abelian_gps.abelian_group_morphism:*",
  "sage.groups.abelian_gps.element_base:*",
]
catalogue = ["cat.groups"]
tests = [
  "Sage doctests for cyclic products, element orders, elementary divisors, subgroup generation and homomorphism images/kernels.",
  "Independent finite-product oracle: enumerate small finite groups and compare cardinality, orders and exponent-vector multiplication.",
]
reuse = { status = "adaptable", components = ["catalogue.cat.groups"], evidence = "The catalogue supplies groups; exact cyclic-factor arithmetic and subgroup/invariant algorithms require native matrix arithmetic or an accepted backend." }
backends = ["gap"]
references = ["[Cohen1]", "[Cohen2]", "[Rotman]"]

[[capability]]
id = "groups.core-operations"
title = "Generic group operations and products"
statement = "Provide common group predicates and constructions including semidirect products, kernels, exponent conversion and generic group-element behavior."
domain = "Groups and homomorphisms satisfying the relevant Sage category contracts."
contract = "Group data -> exact generic operations such as order/finite/abelian predicates, semidirect products, kernel subgroups, additive-to-multiplicative conversion and compatible element coercions."
exactness = "conditional"
exactness_notes = "Each operation is exact on the group classes satisfying its source-level hypotheses; generic base classes intentionally raise when no implementation is available."
algorithms = [{ family = "Category-driven group constructions and wrappers", sources = ["sage.groups.group:Group", "sage.groups.group_exp:*", "sage.groups.group_semidirect_product:*", "sage.groups.kernel_subgroup:*", "sage.groups.generic:*"] }]
depends_on = ["groups.free-and-indexed"]
sage = [
  "sage.groups.group:*",
  "sage.groups.group_exp:*",
  "sage.groups.group_semidirect_product:*",
  "sage.groups.kernel_subgroup:*",
  "sage.groups.generic:*",
]
catalogue = ["cat.groups"]
tests = [
  "Sage doctests for generic group predicates, semidirect products, kernels and additive/multiplicative conversions.",
  "Independent law oracle: verify identity, inverse, associativity and homomorphism kernel/image conditions on generated finite examples.",
]
reuse = { status = "adaptable", components = ["catalogue.cat.groups"], evidence = "The catalogue supplies group laws and morphisms; generic constructions and coercion policies require native adapters around accepted group objects." }
backends = []
references = []

