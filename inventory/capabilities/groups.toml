# Sage 11.0.beta5, c00171e47d6e68d8148d7ee10c4dd77b71a97662.
# These selectors cover the inspected permutation-group and presentation operations.
domain = "groups"

[[capability]]
id = "groups.permutation-group"
title = "Finite permutation group from generators"
statement = "Construct the subgroup of the symmetric group on a finite domain generated by supplied permutations."
domain = "A finite domain with decidable equality and permutations acting on that same domain."
contract = "(X, generators in Sym(X)) -> G ≤ Sym(X), retaining X, its action, the original generators and the inclusion G ↪ Sym(X). Group multiplication and inverse are executable."
exactness = "exact"
algorithms = [{ family = "Permutation composition and checked stabilizer-chain construction", sources = ["sage/groups/perm_gps/permgroup.py:PermutationGroup", "hex-dev HexPermGroup/Build.lean"] }]
depends_on = []
sage = ["sage.groups.perm_gps.permgroup:PermutationGroup", "sage.groups.perm_gps.permgroup:PermutationGroup_generic", "sage.groups.perm_gps.permgroup:PermutationGroup_generic.subgroup"]
catalogue = ["obj.groups.symmetric", "obj.sets.permutations", "obj.subgroups.subgroup"]
tests = ["Baseline doctests: sage/groups/perm_gps/permgroup.py, PermutationGroup and PermutationGroup_generic.subgroup. Compare generated subgroups through membership in both directions on the same labelled domain, rather than printed generators."]
reuse = { status = "reusable", components = ["hex.HexPermGroup.perm", "hex.HexPermGroup.schreier-sims", "hex.HexPermGroupTheory.group-bridge"], evidence = "HexPermGroup builds a checked stabilizer chain from an Array of Perm n; its theory bridge relates the result to Mathlib permutation groups. A runtime finite domain still needs a chosen equivalence with Fin n and transport of the action." }
backends = ["gap"]
references = []
license_notes = "Sage source is GPL-2.0-or-later; Hex source is Apache-2.0. Inspect the license before translating Sage code."

[[capability]]
id = "groups.order-and-membership"
title = "Finite permutation group order and constructive membership"
statement = "Compute the order of a generator-defined permutation group and decide whether a permutation lies in it, returning a generator word for a positive answer."
domain = "Finite permutation groups on a fixed domain; membership query in the same symmetric group."
contract = "(G ≤ Sym(X), p in Sym(X)) -> (|G|, membership, optional word in the supplied generators). A returned word evaluates to p, and the order is the number of distinct elements of G."
exactness = "exact"
algorithms = [{ family = "Schreier-Sims stabilizer chain, orbit product and sifting", sources = ["sage/groups/perm_gps/permgroup.py:PermutationGroup_generic.order", "hex-dev HexPermGroup/Group.lean", "hex-dev HexPermGroup/Membership.lean"] }]
depends_on = ["groups.permutation-group"]
sage = ["sage.groups.perm_gps.permgroup:PermutationGroup_generic.order"]
catalogue = []
tests = ["Baseline doctests: sage/groups/perm_gps/permgroup.py, PermutationGroup_generic.order. Compare order and membership with Sage/GAP on identical runtime generators and queries; compare constructive membership by evaluating the returned word, since valid words need not coincide."]
reuse = { status = "reusable", components = ["hex.HexPermGroup.schreier-sims", "hex.HexPermGroup.membership-words"], evidence = "Hex.Group.order is the product of basic orbit sizes; Group.contains and word? sift against a checked stabilizer chain. Sage order uses GAP Size after special cases." }
backends = ["gap"]
references = []

[[capability]]
id = "groups.orbit"
title = "Orbit of a point under a finite group action"
statement = "Compute the orbit of a point under a generator-defined group action."
domain = "Finite group actions on a finite set with decidable equality, including actions on points, tuples and subsets when those are supplied as the acted-on set."
contract = "(G acts on X, x in X) -> finite subset G·x of X, with the original action and a transporter g for each returned point."
exactness = "exact"
algorithms = [{ family = "Breadth-first traversal under generators with Schreier transversals", sources = ["sage/groups/perm_gps/permgroup.py:PermutationGroup_generic.orbit", "hex-dev HexPermGroup/Orbit/Build.lean"] }]
depends_on = ["groups.permutation-group"]
sage = ["sage.groups.perm_gps.permgroup:PermutationGroup_generic.orbit", "sage.groups.perm_gps.permgroup:PermutationGroup_generic.orbits", "sage.groups.perm_gps.permgroup:PermutationGroup_action.orbits"]
catalogue = []
tests = ["Baseline doctests: sage/groups/perm_gps/permgroup.py, PermutationGroup_generic.orbit and orbits. Compare Sage/GAP orbit sets and partitions without depending on enumeration order; compare transporters by their action on the source point."]
reuse = { status = "reusable", components = ["hex.HexPermGroup.orbits", "hex.HexPermGroup.actions"], evidence = "Hex Orbit.ofSymmetric constructs a checked Schreier tree; Hex Action supplies orbit construction on supported finite action domains. The Sage method also exposes GAP actions on tuples and sets." }
backends = ["gap"]
references = []

[[capability]]
id = "groups.stabilizer"
title = "Stabilizer subgroup of an action point"
statement = "Construct the subgroup of elements fixing a specified point under a finite group action."
domain = "Finite permutation groups acting on a finite set, including an induced action on subsets."
contract = "(G acts on X, x in X) -> G_x ↪ G with G_x={g in G | g·x=x}; retain the action, point and inclusion. The subgroup remains usable for order, membership and further stabilizers."
exactness = "exact"
algorithms = [{ family = "Stabilizer-chain refinement from an orbit transversal", sources = ["sage/groups/perm_gps/permgroup.py:PermutationGroup_generic.stabilizer", "hex-dev HexPermGroup/Subgroup.lean"] }]
depends_on = ["groups.permutation-group", "groups.orbit"]
sage = ["sage.groups.perm_gps.permgroup:PermutationGroup_generic.stabilizer"]
catalogue = ["obj.subgroups.action_stabilizer"]
tests = ["Baseline doctests: sage/groups/perm_gps/permgroup.py, PermutationGroup_generic.stabilizer. Compare with the Sage/GAP stabilizer as a subgroup of the same ambient permutation group; different generating sets are permitted."]
reuse = { status = "reusable", components = ["hex.HexPermGroup.subgroup-ops", "hex.HexPermGroup.orbits", "hex.HexPermGroupTheory.structure-specs"], evidence = "Hex Subgroup.stabilizer and pointwise stabilizer are executable; the theory map states their Mathlib specifications. Transport from arbitrary finite action domains must retain the inclusion." }
backends = ["gap"]
references = []

[[capability]]
id = "groups.cosets"
title = "Cosets of a subgroup in a finite permutation group"
statement = "Compute the left or right cosets of a subgroup in its ambient finite group."
domain = "A subgroup H ≤ G where G is a finite permutation group."
contract = "(H ↪ G, side) -> a finite partition of G into H-cosets, retaining H, G, each representative and the chosen side. Left cosets are gH; right cosets are Hg."
exactness = "exact"
algorithms = [{ family = "Transversal construction from a checked permutation group", sources = ["sage/groups/perm_gps/permgroup.py:PermutationGroup_generic.cosets", "hex-dev HexPermGroup/Coset.lean"] }]
depends_on = ["groups.permutation-group", "groups.order-and-membership"]
sage = ["sage.groups.perm_gps.permgroup:PermutationGroup_generic.cosets"]
catalogue = []
tests = ["Baseline doctests: sage/groups/perm_gps/permgroup.py, PermutationGroup_generic.cosets. Compare partitions with Sage for the same subgroup and side, ignoring representative and enumeration choices."]
reuse = { status = "reusable", components = ["hex.HexPermGroup.rank-enumerate-cosets", "hex.HexPermGroup.subgroup-ops"], evidence = "Hex provides cosets and transversals for a built permutation group. Sage cosets enumerates elements and is documented as a naive instructional implementation." }
backends = []
references = []

[[capability]]
id = "groups.presentation-coset-enumeration"
title = "Coset enumeration from a finite group presentation"
statement = "Enumerate cosets of a finitely generated subgroup of a finitely presented group when enumeration terminates, retaining the resulting action and generator map."
domain = "A free group on finitely many generators, finitely many relators, and subgroup generators as words in the free group; finite index is not decidable in general."
contract = "(presentation F/⟨⟨R⟩⟩, subgroup words, resource bound) -> finite coset table or bounded failure. A completed table defines an action of the presented group on cosets; every relator acts trivially and original generators map to the returned permutations."
exactness = "exact"
exactness_notes = "A completed table is exact; bounded failure makes no claim about finiteness or index."
algorithms = [{ family = "Todd-Coxeter coset enumeration", sources = ["sage/groups/finitely_presented.py:FinitelyPresentedGroup.as_permutation_group", "GAP CosetTable"] }]
depends_on = ["groups.permutation-group"]
sage = ["sage.groups.finitely_presented:FinitelyPresentedGroup.as_permutation_group"]
catalogue = []
tests = ["Baseline doctests: sage/groups/finitely_presented.py, FinitelyPresentedGroup.as_permutation_group. Compare completed actions with GAP CosetTable for the same presentation and subgroup up to coset relabelling that intertwines the original generator actions. Resource exhaustion is inconclusive, not a different mathematical result."]
reuse = { status = "formalized-not-executable", components = ["mathlib.group.presented-group", "mathlib.group.coset-enumeration", "mathlib.group.free-group"], evidence = "Mathlib supplies presentation and free-group semantics, but the audited GroupTheory tree has no Todd-Coxeter algorithm. Hex permutation-group cosets require an already constructed permutation group, so they do not implement this construction from relators." }
backends = ["gap"]
references = []
license_notes = "Sage source is GPL-2.0-or-later; GAP algorithm and license must be checked before any source translation."
