# Finite topological complexes in Sage 11.0.beta5, c00171e47d6e68d8148d7ee10c4dd77b71a97662.

domain = "topology"

[[capability]]
id = "topology.finite-simplicial-complex"
title = "Finite abstract simplicial complex from maximal faces"
statement = "Construct the downward-closed family of faces generated by finite maximal simplices."
domain = "Finite vertex sets and finite families of subsets; repeated input facets do not create distinct simplices."
contract = "facets -> K with computable faces and maximal faces; preserve vertex identity and incidence for boundary and map computations."
exactness = "exact"
algorithms = [{ family = "Subset closure and maximal-face reduction", sources = ["sage.topology.simplicial_complex:SimplicialComplex", "sage.topology.simplicial_complex:SimplicialComplex.faces"] }]
depends_on = []
sage = ["sage.topology.simplicial_complex:SimplicialComplex", "sage.topology.simplicial_complex:SimplicialComplex.faces", "sage.topology.simplicial_complex:SimplicialComplex.maximal_faces"]
catalogue = []
tests = ["Sage doctests: sage.topology.simplicial_complex:SimplicialComplex and SimplicialComplex.faces; compare face sets by vertex identity, independent of ordering."]
reuse = { status = "formalized-not-executable", components = ["mathlib.topology.simplicial"], evidence = "Mathlib has simplicial sets as functors and geometric simplicial complexes, but the surveyed source has no finite abstract face-family computation or boundary matrices." }
backends = []
references = []

[[capability]]
id = "topology.simplicial-chain-complex"
title = "Chain complex of a finite simplicial complex"
statement = "Compute free chain groups on oriented simplices and their signed boundary maps."
domain = "Finite simplicial complexes and a commutative coefficient ring; relative complexes require a specified subcomplex."
contract = "(K,R,L optional) -> finite chain complex C_*(K,L;R) with simplex-indexed bases and differentials; retain the inclusion and quotient maps for relative chains."
exactness = "exact"
algorithms = [{ family = "Oriented face-incidence boundary matrices", sources = ["sage.topology.simplicial_complex:SimplicialComplex.chain_complex", "sage.topology.simplicial_set:SimplicialSet_finite.chain_complex"] }]
depends_on = ["topology.finite-simplicial-complex", "complexes.finite-free-construction", "matrices.arithmetic"]
sage = ["sage.topology.simplicial_complex:SimplicialComplex.chain_complex", "sage.topology.simplicial_set:SimplicialSet_finite.chain_complex"]
catalogue = []
tests = ["Sage doctests: sage.topology.simplicial_complex:SimplicialComplex.chain_complex and sage.topology.simplicial_set:SimplicialSet_finite.chain_complex; compare oriented boundary matrices after transporting simplex bases.", "Check d_(n-1) composed with d_n = 0 for generated boundary maps, including relative examples."]
reuse = { status = "adaptable", components = ["mathlib.topology.simplicial", "mathlib.homology.complexes"], evidence = "Mathlib supplies abstract simplicial sets and homological complexes, but the surveyed source does not produce finite oriented boundary matrices from simplices." }
backends = []
references = []

[[capability]]
id = "topology.simplicial-homology"
title = "Homology of a finite simplicial complex"
statement = "Compute homology groups of a finite simplicial complex, with cycle representatives when requested."
domain = "Finite simplicial complexes over Z or an effective exact field; optional relative subcomplex and reduced convention."
contract = "(K,L,R,n) -> H_n(K,L;R) and optional cycle representatives in the simplex basis; retain the map from cycles to homology classes."
exactness = "exact"
algorithms = [{ family = "Build boundary matrices and compute kernel modulo image", sources = ["sage.topology.cell_complex:GenericCellComplex.homology", "sage.topology.simplicial_complex:SimplicialComplex.chain_complex", "[DHSW2003]"] }]
depends_on = ["topology.simplicial-chain-complex", "complexes.homology-with-representatives"]
sage = ["sage.topology.cell_complex:GenericCellComplex.homology"]
catalogue = []
tests = ["Sage doctests: sage.topology.cell_complex:GenericCellComplex.homology, including reduced and relative examples; compare invariant factors and represented cycles after basis transport, not printed group order."]
reuse = { status = "adaptable", components = ["mathlib.homology.homology", "hex.HexSmith.snf"], evidence = "Mathlib states homology noncomputably. Hex computes integer Smith form, while chain construction and representative transport remain separate obligations." }
backends = ["pari"]
references = ["DHSW2003"]
