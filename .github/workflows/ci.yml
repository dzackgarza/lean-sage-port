name: CI
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  lean:
    name: Build the Lean targets on the newest Lean, Mathlib and Hex
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Clone QC infrastructure
      run: git clone --depth 1 https://github.com/dzackgarza/ai-review-ci.git "$HOME/ai-review-ci"
    - name: Install ripgrep
      run: sudo apt-get update && sudo apt-get install -y ripgrep
    - name: Install elan
      run: 'curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none

        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

        '
    - name: Install just
      uses: extractions/setup-just@v4
    - name: Build and scan
      run: just test-ci
