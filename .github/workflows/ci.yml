name: CI
'on':
  push:
    branches:
    - main
    paths:
    - '**.lean'
    - lakefile.toml
    - lake-manifest.json
    - tools/inventory/pyproject.toml
    - tools/inventory/uv.lock
    - tools/inventory/src/**
    - tools/inventory/tests/**
    - inventory/**
    - lean-toolchain
    - justfile
    - .github/workflows/ci.yml
  workflow_dispatch: null
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lean:
    name: Build and test the locked Lean and inventory environments
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Clone QC infrastructure
      run: git clone --depth 1 https://github.com/dzackgarza/ai-review-ci.git "$HOME/ai-review-ci"
    - name: Install ripgrep
      run: sudo apt-get update && sudo apt-get install -y ripgrep
    - name: Install elan
      run: 'curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none

        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

        '
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
    - name: Install uv
      uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
    - name: Build and scan
      run: just test-ci
